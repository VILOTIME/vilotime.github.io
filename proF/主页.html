<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>叶初小游戏PC版</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #eef2f7;
    background-image: radial-gradient(circle at 50% 0, rgba(79,156,249,0.16), rgba(238,242,247,0) 55%);
    background-repeat: no-repeat;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  .header {
    background-image: linear-gradient(135deg, #2b3a4b 0%, #3f5a78 100%);
    color: #fff;
    padding: 24px 16px 20px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(20,35,55,0.18);
  }
  .header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  /* 标题下方的装饰短线 */
  .header h1::after {
    content: "";
    display: block;
    width: 46px;
    height: 3px;
    margin: 10px auto 0;
    border-radius: 2px;
    background-color: #4f9cf9;
  }
  .container {
    max-width: 1160px;
    margin: 0 auto;
    padding: 30px 20px 44px;
  }
  /* 所有卡片等宽等高，整行居中，缩放时保持一致 */
  .row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: stretch;
    gap: 20px;
  }
  .game-div {
    position: relative;
    overflow: hidden;
    flex: 0 0 260px;
    height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    background-color: #fff;
    border: 1px solid #e4eaf2;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(16,24,40,0.06), 0 10px 22px -14px rgba(16,24,40,0.22);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    cursor: pointer;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* 悬停时从顶部展开的强调色短线 */
  .game-div::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    width: 52px;
    height: 3px;
    border-radius: 0 0 3px 3px;
    background-color: #4f9cf9;
    transform: translateX(-50%) scaleX(0);
    transition: transform 0.3s ease;
  }
  .game-div:hover {
    transform: translateY(-4px);
    border-color: #b9d2f2;
    box-shadow: 0 4px 10px rgba(16,24,40,0.07), 0 16px 28px -14px rgba(37,99,235,0.42);
  }
  .game-div:hover::before {
    transform: translateX(-50%) scaleX(1);
  }
  .game-div:active {
    transform: translateY(-1px);
  }
  .game-icon {
    font-size: 26px;
    line-height: 1;
  }
  .game-title {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.3;
    color: #1f2d3d;
    word-break: break-word;
  }

  /* 移动端适配 */
  @media (max-width: 768px) {
    .header {
      padding: 16px 12px 14px;
    }
    .header h1 {
      font-size: 20px;
      letter-spacing: 1px;
    }
    .header h1::after {
      width: 34px;
      height: 2px;
      margin-top: 7px;
    }
    .container {
      padding: 18px 12px 32px;
    }
    .row {
      gap: 12px;
    }
    .game-div {
      flex: 0 0 calc(50% - 6px);
      height: 104px;
      gap: 6px;
      border-radius: 10px;
    }
    .game-icon {
      font-size: 20px;
    }
    .game-title {
      font-size: 14px;
    }
  }

  /* 触屏设备去掉悬停位移，改用点按反馈 */
  @media (hover: none) {
    .game-div:hover {
      transform: none;
      border-color: #e4eaf2;
      box-shadow: 0 1px 3px rgba(16,24,40,0.06), 0 10px 22px -14px rgba(16,24,40,0.22);
    }
    .game-div:hover::before {
      transform: translateX(-50%) scaleX(0);
    }
    .game-div:active {
      transform: scale(0.98);
    }
  }
</style>
</head>
<body>

<div class="header">
  <h1>叶初小游戏</h1>
</div>

<div class="container">
  <div class="row">
    <div class="game-div" onclick="location.href='CS平面版.html';">
      <span class="game-icon" aria-hidden="true">🎯</span>
      <h3 class="game-title">CS平面版</h3>
    </div>
    <div class="game-div" onclick="location.href='练习模拟器.html';">
      <span class="game-icon" aria-hidden="true">🖱️</span>
      <h3 class="game-title">练习模拟器</h3>
    </div>
    <div class="game-div" onclick="location.href='叶初弹弹乐.html';">
      <span class="game-icon" aria-hidden="true">🏓</span>
      <h3 class="game-title">叶初弹弹乐</h3>
    </div>
    <div class="game-div" onclick="location.href='叶初打飞机.html';">
      <span class="game-icon" aria-hidden="true">✈️</span>
      <h3 class="game-title">叶初打飞机</h3>
    </div>
    <div class="game-div" onclick="location.href='双人足球.html';">
      <span class="game-icon" aria-hidden="true">⚽</span>
      <h3 class="game-title">双人足球</h3>
    </div>
    <div class="game-div" onclick="location.href='叶初全明星.html';">
      <span class="game-icon" aria-hidden="true">⭐</span>
      <h3 class="game-title">叶初全明星</h3>
    </div>
    <div class="game-div" onclick="location.href='任意球练习.html';">
      <span class="game-icon" aria-hidden="true">🥅</span>
      <h3 class="game-title">任意球练习</h3>
    </div>
    <!-- 更多游戏div -->
  </div>
</div>

</body>
</html>
