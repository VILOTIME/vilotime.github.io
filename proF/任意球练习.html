<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>任意球大师</title>
<link rel="stylesheet" href="yc-ui.css">
<style>
  /* 底部按钮：射门 / 锁定扑救点位 */
  #shootBtn {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    z-index: 8; margin: 0; padding: 10px 34px; font-size: 16px;
  }
  #shootBtn.hidden { display: none; }
  /* 阶段小标签（左上角下面，显示当前是进攻还是防守） */
  #phaseTag {
    position: absolute; left: 10px; top: 46px; z-index: 6;
    font-size: 12px; letter-spacing: 1px; color: #9fe0ff;
    background: rgba(8,14,24,.55); border: 1px solid rgba(120,180,255,.18);
    border-radius: 999px; padding: 4px 11px; pointer-events: none;
  }
  #hint { bottom: 66px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="hud">
      <div class="chip"><span class="dot" style="background:#4f9cf9"></span>进球 <b id="scored">0</b></div>
      <div class="chip">第 <b id="round">1</b> / 5 轮</div>
      <div class="chip"><span class="dot" style="background:#ff5d5d"></span>被进 <b id="conceded">0</b></div>
    </div>

    <div id="phaseTag">你的射门</div>
    <div id="banner"></div>
    <div id="hint"></div>

    <button class="btn" id="shootBtn" type="button">确定射门</button>

    <div class="tools">
      <button class="tool-btn" id="fsBtn" type="button" title="全屏（F）">⛶ 全屏</button>
    </div>

    <div class="overlay" id="intro">
      <div class="panel">
        <h1>任意球大师</h1>
        <p><b>进攻</b>：你先选好射门角度，确认后开球，人机会预判并扑救。</p>
        <p><b>防守</b>：先预判落点并锁定，锁定后不能改；接着人机开球，你的门将扑向你选的点位。</p>
        <p>共 5 轮，每轮一次进攻 + 一次防守。</p>
        <p style="margin-top:12px">直接点球门区域选位置（鼠标移开不会改动），再点下面的按钮确认；键盘用 <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 微调，<kbd>空格</kbd> 确认。</p>
        <button class="btn" id="startBtn" type="button">开始</button>
      </div>
    </div>

    <div class="overlay hidden" id="over">
      <div class="panel">
        <h1 id="overTitle">练习结束</h1>
        <p>进球 <b id="finalScored">0</b> ： 被进 <b id="finalConceded">0</b></p>
        <p id="overComment"></p>
        <button class="btn" id="retryBtn" type="button">再来一轮</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
 * 任意球大师
 *   规则（按需求）：
 *     进攻：玩家决定射门角度 → 确定射门 → 人机门将预判扑救
 *     防守：玩家先预测点位并锁定（之后不能改）→ 人机开球 → 玩家门将扑向该点位
 *   5 轮，每轮一攻一守。
 * ============================================================ */

/* ---------- 场地常量 ---------- */
var W = 480, H = 360;
var GOAL = { hw: 132, y0: 120, y1: 176 };          /* 球门：半宽 132，横梁距草皮 56 */
var AIM = { xMin: -119, xMax: 119, yMin: 128, yMax: 170 };
var BALL_START = { x: 0, y: -98 };
var KEEPER_DEF = { w: 30, h: 56, reach: 40, speed: 330 };
var FLIGHT_T = 0.85;                                /* 球飞到门线的时间 */
var ROUNDS = 5;

/* ---------- 画布 ---------- */
var cv = document.getElementById('cv');
var st = document.getElementById('stage');
var ctx = cv.getContext('2d');
var UNIT = 2;

function resize() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var s = Math.min((vw - 26) / W, (vh - 26) / H);
  s = Math.max(0.42, s);
  var dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
  st.style.width = cv.style.width;
  st.style.height = cv.style.height;
  UNIT = s * dpr;
}

/* ---------- 状态 ---------- */
var state = 'intro';                 /* intro | aimAtk | flyAtk | resAtk | aimDef | lockedDef | flyDef | resDef | over */
var round = 1;
var scored = 0, conceded = 0;
var bannerTimer = 0, resultTimer = 0;
var particles = [];
var trail = [];

var crosshair = { x: 0, y: (AIM.yMin + AIM.yMax) / 2 };
var lockedPoint = null;

var ball = { x: BALL_START.x, y: BALL_START.y, r: 9, spin: 0 };
var flight = null;                   /* { sx, sy, tx, ty, t } */
var keeper = { x: 0, tx: 0, delay: 0, tilt: 0, color: '#ff5d5d' };

/* ---------- 工具 ---------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOut(t) { return 1 - (1 - t) * (1 - t); }

var elRound = document.getElementById('round');
var elScored = document.getElementById('scored');
var elConceded = document.getElementById('conceded');
var elBanner = document.getElementById('banner');
var elHint = document.getElementById('hint');
var elPhase = document.getElementById('phaseTag');
var elBtn = document.getElementById('shootBtn');

function banner(text, ms) {
  elBanner.textContent = text;
  elBanner.classList.add('show');
  bannerTimer = (ms || 1000) / 1000;
}
function hint(text) { elHint.textContent = text || ''; }
function phaseTag(text) { elPhase.textContent = text || ''; }
function hud() {
  elRound.textContent = round;
  elScored.textContent = scored;
  elConceded.textContent = conceded;
}

function boom(x, y, color, n) {
  for (var i = 0; i < (n || 14); i++) {
    var a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 150;
    particles.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.35 + Math.random() * 0.35, max: 0.7, color: color
    });
  }
}

/* ============================================================
 * 流程
 * ============================================================ */
function startGame() {
  round = 1; scored = 0; conceded = 0;
  particles = []; trail = [];
  hud();
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  startAttack();
}

function startAttack() {
  state = 'aimAtk';
  crosshair.x = 0; crosshair.y = (AIM.yMin + AIM.yMax) / 2;
  lockedPoint = null;
  ball.x = BALL_START.x; ball.y = BALL_START.y; ball.r = 9;
  keeper.x = 0; keeper.tx = 0; keeper.tilt = 0; keeper.color = '#ff5d5d';
  flight = null;
  hud();
  phaseTag('你的射门');
  elBtn.textContent = '确定射门';
  elBtn.classList.remove('hidden');
  hint('点球门区域选好角度，再点「确定射门」');
  banner('第 ' + round + ' 轮 · 你主罚', 1100);
}

function startDefense() {
  state = 'aimDef';
  crosshair.x = 0; crosshair.y = (AIM.yMin + AIM.yMax) / 2;
  lockedPoint = null;
  ball.x = BALL_START.x; ball.y = BALL_START.y; ball.r = 9;
  keeper.x = 0; keeper.tx = 0; keeper.tilt = 0; keeper.color = '#4f9cf9';
  flight = null;
  phaseTag('你的扑救');
  elBtn.textContent = '锁定扑救点';
  elBtn.classList.remove('hidden');
  hint('点球门区域预判落点，再点「锁定扑救点」（锁定后不能改）');
  banner('第 ' + round + ' 轮 · 你守门', 1100);
}

/* ---- 进攻：确认射门 ---- */
function confirmShot() {
  if (state !== 'aimAtk') { return; }
  state = 'flyAtk';
  elBtn.classList.add('hidden');
  hint('');
  var t = { x: clamp(crosshair.x, AIM.xMin, AIM.xMax), y: clamp(crosshair.y, AIM.yMin, AIM.yMax) };
  flight = { sx: ball.x, sy: ball.y, tx: t.x, ty: t.y, t: 0 };
  aiKeeperDecide(t);
}

/* ---- AI 门将预判（进攻时的对方门将） ---- */
function aiKeeperDecide(target) {
  var guessRight = Math.random() < 0.55;            /* 判断对方向 */
  var err;
  if (guessRight) { err = (Math.random() * 2 - 1) * 52; }
  else { err = (Math.random() < 0.5 ? -1 : 1) * (96 + Math.random() * 62); }
  keeper.tx = clamp(target.x + err, -GOAL.hw + 8, GOAL.hw - 8);
  keeper.delay = 0.10 + Math.random() * 0.10;       /* 起跳反应时间 */
}

/* ---- 防守：锁定扑救点位 ---- */
function confirmLock() {
  if (state !== 'aimDef') { return; }
  lockedPoint = { x: clamp(crosshair.x, AIM.xMin, AIM.xMax), y: clamp(crosshair.y, AIM.yMin, AIM.yMax) };
  state = 'lockedDef';
  elBtn.classList.add('hidden');
  hint('点位已锁定，人机准备开球…');
  banner('点位已锁定', 900);
  boom(lockedPoint.x, lockedPoint.y, 'rgba(120,200,255,.9)', 10);
  resultTimer = 1.05;                               /* 之后人机开球 */
}

/* ---- 人机开球（防守阶段）：门将此时才扑向玩家锁定的点位 ---- */
function aiShoot() {
  state = 'flyDef';
  keeper.tx = lockedPoint ? lockedPoint.x : 0;
  keeper.delay = 0;
  var r = Math.random(), x;
  if (r < 0.42) { x = -(68 + Math.random() * 52); }         /* 左侧 */
  else if (r < 0.84) { x = (68 + Math.random() * 52); }     /* 右侧 */
  else { x = -32 + Math.random() * 64; }                    /* 中路 */
  var t = { x: clamp(x, AIM.xMin, AIM.xMax), y: AIM.yMin + Math.random() * (AIM.yMax - AIM.yMin) };
  flight = { sx: ball.x, sy: ball.y, tx: t.x, ty: t.y, t: 0 };
  hint('');
}

/* ---- 结算 ---- */
function resolveFlight() {
  if (!flight) { return; }
  var tx = flight.tx;
  var saved = Math.abs(keeper.x - tx) <= KEEPER_DEF.reach;
  var defPhase = (state === 'flyDef');
  flight = null;

  if (defPhase) {
    if (saved) {
      conceded += 0;                                 /* 扑出 */
      banner('扑出！', 1200);
      hint('预判正确，扑到了！');
      boom(keeper.x, GOAL.y0 + 24, 'rgba(120,220,255,.95)', 20);
    } else {
      conceded += 1;
      banner('被进了', 1200);
      hint('点位偏了，下次再看准一点');
      boom(tx, GOAL.y0 + 26, 'rgba(255,120,120,.9)', 18);
    }
    state = 'resDef';
    hud();
    resultTimer = 1.25;
  } else {
    if (saved) {
      banner('被扑出', 1200);
      hint('再找个角度试试');
      boom(keeper.x, GOAL.y0 + 24, 'rgba(255,200,120,.95)', 18);
    } else {
      scored += 1;
      banner('进球！', 1200);
      hint('漂亮！');
      boom(tx, GOAL.y0 + 26, 'rgba(160,255,190,.95)', 22);
    }
    state = 'resAtk';
    hud();
    resultTimer = 1.25;
  }
}

function nextPhase() {
  if (state === 'resAtk') { startDefense(); return; }
  if (state === 'resDef') {
    if (round >= ROUNDS) { gameOver(); return; }
    round += 1;
    hud();
    startAttack();
  }
}

function gameOver() {
  state = 'over';
  elBtn.classList.add('hidden');
  hint('');
  phaseTag('');
  document.getElementById('finalScored').textContent = scored;
  document.getElementById('finalConceded').textContent = conceded;
  var title = '练习结束', comment = '';
  if (scored > conceded) { title = '进攻更胜一筹！'; comment = '射门比扑救稳。'; }
  else if (scored < conceded) { title = '守门要加练'; comment = '扑救点位再准一点。'; }
  else { title = '打成平手'; comment = '继续练，稳一点就有优势。'; }
  document.getElementById('overTitle').textContent = title;
  document.getElementById('overComment').textContent = comment;
  document.getElementById('over').classList.remove('hidden');
  banner('', 0);
  elBanner.classList.remove('show');
}

/* ============================================================
 * 更新
 * ============================================================ */
function update(dt) {
  if (bannerTimer > 0) {
    bannerTimer -= dt;
    if (bannerTimer <= 0) { elBanner.classList.remove('show'); }
  }

  /* 结果停顿 → 进入下一阶段 */
  if (resultTimer > 0) {
    resultTimer -= dt;
    if (resultTimer <= 0) {
      if (state === 'lockedDef') { aiShoot(); }
      else if (state === 'resAtk' || state === 'resDef') { nextPhase(); }
    }
  }

  /* 门将移动 */
  if (state === 'flyAtk' || state === 'flyDef' || state === 'lockedDef') {
    if (keeper.delay > 0) { keeper.delay -= dt; }
    else {
      var d = keeper.tx - keeper.x;
      var step = KEEPER_DEF.speed * dt;
      if (Math.abs(d) <= step) { keeper.x = keeper.tx; }
      else { keeper.x += (d > 0 ? step : -step); }
      keeper.tilt = clamp(d / 26, -1, 1);
    }
  } else {
    keeper.tilt *= Math.max(0, 1 - dt * 6);
  }

  /* 球飞行 */
  if (flight && (state === 'flyAtk' || state === 'flyDef')) {
    flight.t += dt;
    var p = Math.min(1, flight.t / FLIGHT_T);
    var e = easeOut(p);
    ball.x = lerp(flight.sx, flight.tx, p);
    ball.y = lerp(flight.sy, flight.ty, e);
    ball.r = 9 + 3.2 * p;
    ball.spin += dt * 12;
    trail.push({ x: ball.x, y: ball.y, life: 0.28 });
    if (trail.length > 26) { trail.shift(); }
    if (p >= 1) { resolveFlight(); }
  }

  /* 粒子 */
  for (var i = particles.length - 1; i >= 0; i--) {
    var pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= (1 - dt * 2.2); pt.vy *= (1 - dt * 2.2);
    pt.vy -= 60 * dt;
    pt.life -= dt;
    if (pt.life <= 0) { particles.splice(i, 1); }
  }
  for (var j = trail.length - 1; j >= 0; j--) {
    trail[j].life -= dt;
    if (trail[j].life <= 0) { trail.splice(j, 1); }
  }
}

/* ============================================================
 * 绘制
 * ============================================================ */
function drawPitch() {
  var g = ctx.createLinearGradient(0, -H / 2, 0, H / 2);
  g.addColorStop(0, '#12324a');
  g.addColorStop(0.55, '#0e2740');
  g.addColorStop(1, '#0a1c2e');
  ctx.fillStyle = g;
  ctx.fillRect(-W / 2, -H / 2, W, H);

  /* 草坪条纹 */
  for (var i = 0; i < 12; i++) {
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.022)' : 'rgba(0,0,0,0.05)';
    ctx.fillRect(-W / 2 + i * (W / 12), -H / 2, W / 12, H);
  }

  /* 灯光 */
  var lg = ctx.createRadialGradient(0, GOAL.y0 + 40, 10, 0, GOAL.y0 + 40, 260);
  lg.addColorStop(0, 'rgba(180,225,255,0.13)');
  lg.addColorStop(1, 'rgba(180,225,255,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(-W / 2, -H / 2, W, H);

  /* 禁区线 / 罚球弧 */
  ctx.strokeStyle = 'rgba(226,240,255,0.35)';
  ctx.lineWidth = 2;
  ctx.strokeRect(-170, GOAL.y0, 340, -96);
  ctx.beginPath();
  ctx.arc(0, GOAL.y1 + 96, 74, 0.25 * Math.PI, 0.75 * Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, -74, 4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(226,240,255,0.5)';
  ctx.fill();
}

function drawGoal() {
  var hw = GOAL.hw, y0 = GOAL.y0, y1 = GOAL.y1;

  /* 门内阴影 */
  var g = ctx.createLinearGradient(0, y1, 0, y0);
  g.addColorStop(0, 'rgba(6,14,24,0.85)');
  g.addColorStop(1, 'rgba(6,14,24,0.35)');
  ctx.fillStyle = g;
  ctx.fillRect(-hw, y0, hw * 2, y1 - y0);

  /* 球网 */
  ctx.strokeStyle = 'rgba(190,220,255,0.16)';
  ctx.lineWidth = 1;
  for (var x = -hw; x <= hw; x += 18) {
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
  }
  for (var y = y0; y <= y1; y += 14) {
    ctx.beginPath(); ctx.moveTo(-hw, y); ctx.lineTo(hw, y); ctx.stroke();
  }

  /* 门框 */
  ctx.strokeStyle = 'rgba(245,250,255,0.95)';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-hw, y0); ctx.lineTo(-hw, y1); ctx.lineTo(hw, y1); ctx.lineTo(hw, y0);
  ctx.stroke();
  ctx.lineCap = 'butt';

  /* 门线 */
  ctx.strokeStyle = 'rgba(245,250,255,0.55)';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-hw - 14, y0); ctx.lineTo(hw + 14, y0); ctx.stroke();
}

function drawKeeper() {
  var w = KEEPER_DEF.w, h = KEEPER_DEF.h;
  var x = keeper.x, base = GOAL.y0 + 2;
  var tilt = keeper.tilt;

  ctx.save();
  ctx.translate(x, base + h / 2);
  ctx.rotate(-tilt * 0.22);

  /* 影子 */
  ctx.beginPath();
  ctx.ellipse(0, -h / 2 + 3, w * 0.55, 5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();

  /* 身体 */
  var g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, keeper.color);
  g.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = g;
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(-w / 2, -h / 2, w, h, 9); }
  else { ctx.rect(-w / 2, -h / 2, w, h); }
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 2;
  ctx.stroke();

  /* 头 */
  ctx.beginPath();
  ctx.arc(0, h / 2 - 4, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe3c4';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.restore();
}

function drawBall() {
  /* 拖尾 */
  for (var i = 0; i < trail.length; i++) {
    var t = trail[i], a = t.life / 0.28;
    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * 0.75 * a, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200,235,255,' + (0.22 * a).toFixed(3) + ')';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r + 2.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();

  var g = ctx.createRadialGradient(ball.x - ball.r * 0.35, ball.y + ball.r * 0.4, ball.r * 0.2, ball.x, ball.y, ball.r);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.75, '#e7eef8');
  g.addColorStop(1, '#aab8c9');
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  /* 球面花纹 */
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.spin);
  ctx.fillStyle = 'rgba(30,45,64,0.85)';
  ctx.beginPath(); ctx.arc(0, 0, ball.r * 0.3, 0, Math.PI * 2); ctx.fill();
  for (var k = 0; k < 5; k++) {
    var ang = k * Math.PI * 2 / 5;
    ctx.beginPath();
    ctx.arc(Math.cos(ang) * ball.r * 0.66, Math.sin(ang) * ball.r * 0.66, ball.r * 0.17, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawAim() {
  var aiming = (state === 'aimAtk' || state === 'aimDef');

  /* 锁定后的点位：瞄准时和飞行中都标出来 */
  if (lockedPoint && (aiming || state === 'flyDef' || state === 'lockedDef')) {
    ctx.strokeStyle = 'rgba(120,220,255,0.9)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(lockedPoint.x, lockedPoint.y, 15, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(lockedPoint.x, lockedPoint.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(120,220,255,0.9)'; ctx.fill();
  }

  if (!aiming) { return; }
  var cx = crosshair.x, cy = crosshair.y;

  /* 瞄准虚线 */
  ctx.save();
  ctx.setLineDash([6, 7]);
  ctx.strokeStyle = state === 'aimAtk' ? 'rgba(255,209,102,0.55)' : 'rgba(120,200,255,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ball.x, ball.y);
  ctx.quadraticCurveTo((ball.x + cx) / 2, (ball.y + cy) / 2 - 30, cx, cy);
  ctx.stroke();
  ctx.restore();

  /* 准星 */
  var col = state === 'aimAtk' ? '#ffd166' : '#7fd0ff';
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = col; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - 17, cy); ctx.lineTo(cx - 13, cy);
  ctx.moveTo(cx + 13, cy); ctx.lineTo(cx + 17, cy);
  ctx.moveTo(cx, cy - 17); ctx.lineTo(cx, cy - 13);
  ctx.moveTo(cx, cy + 13); ctx.lineTo(cx, cy + 17);
  ctx.stroke();
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i], a = Math.max(0, p.life / p.max);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.4 * a + 0.8, 0, Math.PI * 2);
    ctx.fillStyle = p.color.replace(/,[^,]*\)$/, ',' + a.toFixed(2) + ')');
    if (p.color.indexOf('rgba') !== 0) { ctx.fillStyle = p.color; ctx.globalAlpha = a; }
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(UNIT, 0, 0, -UNIT, cv.width / 2, cv.height / 2);

  drawPitch();
  drawGoal();
  drawAim();
  drawKeeper();
  drawBall();
  drawParticles();
}

/* ============================================================
 * 主循环
 * ============================================================ */
var last = 0, acc = 0, FIXED = 1 / 120, lastAt = 0;
function tick(ts) {
  var now = (typeof ts === 'number' && ts > 0) ? ts : ((window.performance && performance.now) ? performance.now() : Date.now());
  if (!last) { last = now; }
  if (now < last) { now = last; }
  var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  lastAt = now;
  acc = Math.min(acc + dt, 0.1);
  var guard = 0;
  while (acc >= FIXED && guard++ < 12) { update(FIXED); acc -= FIXED; }
  if (acc < 0) { acc = 0; }
  draw();
}
function loop(ts) { tick(ts); requestAnimationFrame(loop); }

/* ============================================================
 * 输入
 * ============================================================ */
function pointerToUnits(e) {
  var rect = cv.getBoundingClientRect();
  var px = (e.clientX - rect.left) / rect.width;
  var py = (e.clientY - rect.top) / rect.height;
  return { x: px * W - W / 2, y: H / 2 - py * H };
}

function moveCrosshair(x, y) {
  if (state !== 'aimAtk' && state !== 'aimDef') { return; }
  crosshair.x = clamp(x, AIM.xMin, AIM.xMax);
  crosshair.y = clamp(y, AIM.yMin, AIM.yMax);
}

/* 只在「点下去」的时候设定瞄准点：鼠标移开不会再改动它，
   这样把手挪到下面的按钮去点确认，准星也不会跟着跑 */
cv.addEventListener('pointerdown', function (e) {
  var p = pointerToUnits(e);
  moveCrosshair(p.x, p.y);
});
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

elBtn.addEventListener('click', function () {
  if (state === 'aimAtk') { confirmShot(); }
  else if (state === 'aimDef') { confirmLock(); }
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft') { moveCrosshair(crosshair.x - 7, crosshair.y); e.preventDefault(); }
  else if (k === 'ArrowRight') { moveCrosshair(crosshair.x + 7, crosshair.y); e.preventDefault(); }
  else if (k === 'ArrowUp') { moveCrosshair(crosshair.x, crosshair.y + 4); e.preventDefault(); }
  else if (k === 'ArrowDown') { moveCrosshair(crosshair.x, crosshair.y - 4); e.preventDefault(); }
  else if (k === ' ' || k === 'Enter') {
    if (state === 'aimAtk') { confirmShot(); e.preventDefault(); }
    else if (state === 'aimDef') { confirmLock(); e.preventDefault(); }
    else if (state === 'intro') { startGame(); e.preventDefault(); }
  }
  else if (k === 'f' || k === 'F') { toggleFullscreen(); }
});

/* ---------- 全屏 ---------- */
var fsBtn = document.getElementById('fsBtn');
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFullscreen() {
  var el = document.documentElement;
  if (!isFull()) {
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { req.call(el).catch(function () {}); }
  } else {
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) { exit.call(document).catch(function () {}); }
  }
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', function () { setTimeout(resize, 60); });

/* ============================================================
 * 启动
 * ============================================================ */
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
requestAnimationFrame(loop);
setInterval(function () {
  var now = (window.performance && performance.now) ? performance.now() : Date.now();
  if (now - lastAt < 100) { return; }
  tick(now);
}, 50);

elBtn.classList.add('hidden');
hint('');
</script>
</body>
</html>
