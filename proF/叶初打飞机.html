<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>叶初打飞机</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 0%, #16243a 0%, #080b12 70%);
    font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    color: #e8f0fb; user-select: none; -webkit-user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10px; }
  #stage { position: relative; }
  canvas { display: block; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(120,180,255,.12) inset; }
  #hud {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; align-items: center; justify-content: space-between;
    pointer-events: none; font-size: 14px; letter-spacing: .5px;
  }
  #hud .chip {
    padding: 6px 12px; border-radius: 999px; background: rgba(8,14,24,.55);
    border: 1px solid rgba(120,180,255,.18); backdrop-filter: blur(4px);
  }
  #hud .score { color: #8fd0ff; font-weight: 700; font-variant-numeric: tabular-nums; }
  #lives { display: flex; gap: 5px; }
  #lives i { width: 12px; height: 12px; border-radius: 50%; background: #4f9cf9; box-shadow: 0 0 8px rgba(79,156,249,.8); display: inline-block; }
  #lives i.dead { background: rgba(255,255,255,.12); box-shadow: none; }
  .overlay {
    position: absolute; inset: 0; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: rgba(6,10,18,.78); backdrop-filter: blur(3px); z-index: 10;
  }
  .overlay.hidden { display: none; }
  .panel { padding: 20px 26px; max-width: 88%; }
  .panel h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 2px; }
  .panel p { margin: 6px 0; font-size: 13px; line-height: 1.7; color: #a9bcda; }
  .btn {
    margin-top: 16px; padding: 11px 26px; font-family: inherit; font-size: 15px; font-weight: 700;
    letter-spacing: 1px; color: #fff; background: linear-gradient(135deg, #2f7bf6, #4f9cf9);
    border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 8px 22px rgba(47,123,246,.45);
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .btn:active { transform: scale(.96); }
  #banner {
    position: absolute; left: 0; right: 0; top: 42%; transform: translateY(-50%);
    font-size: clamp(14px, 3.8vw, 20px); font-weight: 800; letter-spacing: clamp(1px, .6vw, 2px);
    color: #ffd166; text-align: center; white-space: nowrap;
    text-shadow: 0 4px 18px rgba(0,0,0,.8); opacity: 0; transition: opacity .2s ease; pointer-events: none;
  }
  #banner.show { opacity: 1; }
  /* 小屏（手机）：字号整体缩小一档，避免文字挤出棋盘或换行 */
  @media (max-width: 560px) {
    .panel { padding: 14px 16px; }
    .panel h1 { font-size: 19px; letter-spacing: 1px; }
    .panel p { font-size: 12px; line-height: 1.65; margin: 4px 0; }
    .btn { margin-top: 12px; padding: 10px 20px; font-size: 14px; }
    #hud { font-size: 12px; top: 6px; left: 6px; right: 6px; }
    #hud .chip { padding: 4px 9px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="chip">分数 <span class="score" id="score">0</span></div>
      <div class="chip" id="livesWrap"><div id="lives"></div></div>
    </div>
    <div id="banner"></div>
    <div class="overlay" id="intro">
      <div class="panel">
        <h1>叶初打飞机</h1>
        <p>拖动 / 移动鼠标控制战机，按住鼠标或 <b>Q</b> 连续射击</p>
        <p>击落敌机得分，撞到敌机会损失生命</p>
        <button class="btn" id="startBtn" type="button">开始游戏</button>
      </div>
    </div>
    <div class="overlay hidden" id="over">
      <div class="panel">
        <h1 id="overTitle">游戏结束</h1>
        <p>最终得分 <b id="finalScore">0</b></p>
        <button class="btn" id="retryBtn" type="button">再来一局</button>
      </div>
    </div>
  </div>
</div>

var bgImg = new Image(); bgImg.src = BG_SRC;
/* ===================== 画布与坐标系 ===================== */
var W = 480, H = 360;          /* 逻辑坐标 */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var UNIT = 2;
function resize() {
  var pad = 20;
  var s = Math.min((window.innerWidth - pad) / W, (window.innerHeight - pad) / H);
  s = Math.max(0.5, s);
  cv.width = Math.round(W * s * (window.devicePixelRatio || 1));
  cv.height = Math.round(H * s * (window.devicePixelRatio || 1));
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
  UNIT = cv.width / W;
  var st = document.getElementById('stage');
  st.style.width = Math.round(W * s) + 'px';
  st.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ===================== 状态 ===================== */
var state = 'intro';           /* intro | playing | over */
var score = 0, lives = 3;
var player = { x: 0, y: -130, r: 13, inv: 0 };
var bullets = [], enemies = [], particles = [], stars = [];
var tapX = null, firing = false, time = 0, spawnTimer = 0, difficulty = 1;
var keys = {};

/* 星空背景（自绘层，叠加在背景图上做纵深感） */
for (var i = 0; i < 70; i++) {
  stars.push({ x: Math.random() * W - W / 2, y: Math.random() * H - H / 2, z: Math.random() * 0.8 + 0.2 });
}

/* ===================== 输入 ===================== */
function stagePoint(ev) {
  var r = cv.getBoundingClientRect();
  var cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
  var x = cx / r.width * W - W / 2;
  return x;
}
function fireDown() { firing = true; }
function fireUp() { firing = false; }
cv.addEventListener('mousedown', function (e) { e.preventDefault(); fireDown(); tapX = stagePoint(e); });
cv.addEventListener('mousemove', function (e) { tapX = stagePoint(e); });
window.addEventListener('mouseup', function () { fireUp(); });
cv.addEventListener('touchstart', function (e) { e.preventDefault(); fireDown(); tapX = stagePoint(e); }, { passive: false });
cv.addEventListener('touchmove', function (e) { e.preventDefault(); tapX = stagePoint(e); }, { passive: false });
window.addEventListener('touchend', function () { fireUp(); });
window.addEventListener('keydown', function (e) {
  var k = (e.key || '').toLowerCase();
  keys[k] = true;
  if (k === 'q') { firing = true; e.preventDefault(); }
  if (state === 'intro' && (k === ' ' || k === 'enter')) { startGame(); }
});
window.addEventListener('keyup', function (e) {
  var k = (e.key || '').toLowerCase();
  keys[k] = false;
  if (k === 'q') { firing = false; }
});
window.addEventListener('blur', function () { firing = false; });

/* ===================== 游戏流程 ===================== */
function startGame() {
  state = 'playing';
  score = 0; lives = 3; difficulty = 1; time = 0; spawnTimer = 0;
  bullets = []; enemies = []; particles = [];
  player.x = 0; player.y = -130; player.inv = 1.2;
  document.getElementById('score').textContent = '0';
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  renderLives();
  banner('起飞！', 900);
}
function gameOver() {
  state = 'over';
  document.getElementById('over').classList.remove('hidden');
  document.getElementById('overTitle').textContent = '游戏结束';
  document.getElementById('finalScore').textContent = score;
}
function renderLives() {
  var box = document.getElementById('lives');
  box.innerHTML = '';
  for (var i = 0; i < 3; i++) {
    var d = document.createElement('i');
    if (i >= lives) { d.className = 'dead'; }
    box.appendChild(d);
  }
}
var bannerTimer = 0;
function banner(text, ms) {
  var b = document.getElementById('banner');
  b.textContent = text; b.classList.add('show');
  bannerTimer = ms / 1000;
}

/* ===================== 生成 / 更新 ===================== */
function spawnEnemy() {
  var kinds = ['drift', 'weave', 'chase'];
  var kind = kinds[Math.floor(Math.random() * (difficulty > 1.6 ? 3 : 2))];
  enemies.push({
    x: (Math.random() - 0.5) * (W - 80),
    y: H / 2 + 20,
    r: 15,
    vy: -(95 + difficulty * 20) - Math.random() * 35,
    vx: 0, kind: kind, hp: 2, phase: Math.random() * 6.28, hurt: 0
  });
}

function boom(x, y, color, n) {
  for (var i = 0; i < (n || 14); i++) {
    var a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 120;
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.4, max: 0.9, color: color || '#ffd166' });
  }
}

var fireCooldown = 0;
function update(dt) {
  if (state !== 'playing') { return; }
  time += dt;
  difficulty = 1 + Math.min(2.2, Math.floor(time / 20) * 0.45);

  /* 战机跟随鼠标 / 触摸 */
  if (tapX !== null) {
    player.x += (tapX - player.x) * Math.min(1, dt * 14);
  }
  if (player.x < -W / 2 + 20) { player.x = -W / 2 + 20; }
  if (player.x > W / 2 - 20) { player.x = W / 2 - 20; }
  if (player.inv > 0) { player.inv -= dt; }

  /* 射击 */
  fireCooldown -= dt;
  if (firing && fireCooldown <= 0) {
    bullets.push({ x: player.x, y: player.y + 12, vy: 430, r: 3.2 });
    fireCooldown = 0.055;
  }

  /* 子弹 */
  for (var b = bullets.length - 1; b >= 0; b--) {
    var bl = bullets[b];
    bl.y += bl.vy * dt;
    if (bl.y > H / 2 + 10) { bullets.splice(b, 1); }
  }

  /* 敌机 AI：漂移 / 蛇形 / 追踪 */
  for (var e = enemies.length - 1; e >= 0; e--) {
    var en = enemies[e];
    en.phase += dt * 3;
    if (en.kind === 'weave') {
      en.x += Math.sin(en.phase) * 40 * dt * 2.2;
    } else if (en.kind === 'chase') {
      var dx = player.x - en.x;
      en.x += Math.sign(dx) * Math.min(Math.abs(dx), 46 * dt);
    } else {
      en.x += Math.sin(en.phase * 0.4) * 18 * dt;
    }
    if (en.x < -W / 2 + 16) { en.x = -W / 2 + 16; }
    if (en.x > W / 2 - 16) { en.x = W / 2 - 16; }
    en.y += en.vy * dt;
    if (en.hurt > 0) { en.hurt -= dt; }
    if (en.y < -H / 2 - 30) { enemies.splice(e, 1); continue; }

    /* 子弹命中 */
    for (var bi = bullets.length - 1; bi >= 0; bi--) {
      var bb = bullets[bi];
      var ddx = bb.x - en.x, ddy = bb.y - en.y;
      if (ddx * ddx + ddy * ddy < (en.r + bb.r) * (en.r + bb.r)) {
        bullets.splice(bi, 1);
        en.hp--;
        en.hurt = 0.12;
        boom(en.x, en.y, '#ffd166', 4);
        if (en.hp <= 0) {
          boom(en.x, en.y, '#ff7a45', 18);
          enemies.splice(e, 1);
          score++;
          document.getElementById('score').textContent = score;
          break;
        }
      }
    }
    if (!enemies[e]) { continue; }

    /* 玩家碰撞 */
    var pdx = player.x - en.x, pdy = player.y - en.y;
    var pr = player.r + en.r - 3;
    if (pr * pr > pdx * pdx + pdy * pdy && player.inv <= 0) {
      boom(en.x, en.y, '#ff7a45', 20);
      enemies.splice(e, 1);
      lives--;
      renderLives();
      player.inv = 1.6;
      if (lives <= 0) { gameOver(); return; }
      banner('生命 -1', 900);
    }
  }

  /* 粒子 */
  for (var pi = particles.length - 1; pi >= 0; pi--) {
    var p = particles[pi];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - dt * 2); p.vy *= (1 - dt * 2);
    p.life -= dt;
    if (p.life <= 0) { particles.splice(pi, 1); }
  }

  /* 生成敌机 */
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(0.35, 1.25 - difficulty * 0.25) * (0.7 + Math.random() * 0.6);
  }

  /* 星空 */
  for (var s = 0; s < stars.length; s++) {
    stars[s].y -= (14 + stars[s].z * 26) * dt;
    if (stars[s].y < -H / 2) {
      stars[s].y = H / 2;
      stars[s].x = Math.random() * W - W / 2;
    }
  }
}

/* ===================== 绘制 ===================== */
function draw() {
  var w = cv.width, h = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  /* 背景图铺满 */
  if (bgImg.complete && bgImg.naturalWidth) {
    ctx.drawImage(bgImg, 0, 0, w, h);
  } else {
    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, w, h);
  }
  /* 叠加淡蓝暗角，让画面更统一 */
  ctx.setTransform(UNIT, 0, 0, -UNIT, w / 2, h / 2);   /* Y 轴向上：+y = 屏幕上方 */
  var grd = ctx.createRadialGradient(0, 0, 40, 0, 0, W * 0.7);
  grd.addColorStop(0, 'rgba(10,20,40,0)');
  grd.addColorStop(1, 'rgba(4,8,16,0.55)');
  ctx.fillStyle = grd;
  ctx.fillRect(-W / 2, -H / 2, W, H);

  /* 星星 */
  for (var s = 0; s < stars.length; s++) {
    var st = stars[s];
    ctx.fillStyle = 'rgba(190,220,255,' + (0.15 + st.z * 0.5) + ')';
    ctx.fillRect(st.x, st.y, 1.2 * st.z + 0.6, 1.2 * st.z + 0.6);
  }

  /* 子弹（霓虹拖尾） */
  for (var b = 0; b < bullets.length; b++) {
    var bl = bullets[b];
    var g2 = ctx.createLinearGradient(bl.x, bl.y - 14, bl.x, bl.y + 4);
    g2.addColorStop(0, 'rgba(120,220,255,0)');
    g2.addColorStop(1, 'rgba(150,235,255,0.95)');
    ctx.strokeStyle = g2; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bl.x, bl.y - 14); ctx.lineTo(bl.x, bl.y); ctx.stroke();
  }

  /* 敌机 */
  for (var e = 0; e < enemies.length; e++) {
    var en = enemies[e];
    var r = en.r;
    ctx.save();
    ctx.translate(en.x, en.y);
    if (en.hurt > 0) { ctx.globalAlpha = 0.8; }
    /* ===== 倒飞敌机（机头朝下） ===== */
    var ge = ctx.createLinearGradient(0, -r, 0, r);
    ge.addColorStop(0, '#ffb3c1');
    ge.addColorStop(0.5, '#ff556e');
    ge.addColorStop(1, '#a1173f');
    /* 机身 */
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.05);
    ctx.bezierCurveTo(r * 0.22, -r * 0.55, r * 0.26, -r * 0.1, r * 0.26, r * 0.25);
    ctx.lineTo(r * 0.26, r * 0.85);
    ctx.lineTo(-r * 0.26, r * 0.85);
    ctx.lineTo(-r * 0.26, r * 0.25);
    ctx.bezierCurveTo(-r * 0.26, -r * 0.1, -r * 0.22, -r * 0.55, 0, -r * 1.05);
    ctx.closePath();
    ctx.fillStyle = ge; ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,215,0.85)'; ctx.lineWidth = 1; ctx.stroke();
    /* 前掠主翼 */
    ctx.beginPath();
    ctx.moveTo(r * 0.24, -r * 0.1); ctx.lineTo(r * 1.0, r * 0.35);
    ctx.lineTo(r * 1.0, r * 0.62); ctx.lineTo(r * 0.24, r * 0.3);
    ctx.closePath(); ctx.fillStyle = '#e63a5c'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-r * 0.24, -r * 0.1); ctx.lineTo(-r * 1.0, r * 0.35);
    ctx.lineTo(-r * 1.0, r * 0.62); ctx.lineTo(-r * 0.24, r * 0.3);
    ctx.closePath(); ctx.fillStyle = '#e63a5c'; ctx.fill();
    /* 尾翼 */
    ctx.beginPath();
    ctx.moveTo(r * 0.2, r * 0.6); ctx.lineTo(r * 0.5, r * 0.95); ctx.lineTo(r * 0.5, r * 1.1); ctx.lineTo(r * 0.2, r * 0.85);
    ctx.closePath(); ctx.fillStyle = '#c72f4f'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-r * 0.2, r * 0.6); ctx.lineTo(-r * 0.5, r * 0.95); ctx.lineTo(-r * 0.5, r * 1.1); ctx.lineTo(-r * 0.2, r * 0.85);
    ctx.closePath(); ctx.fillStyle = '#c72f4f'; ctx.fill();
    /* 玻璃座舱 + 核心光 */
    ctx.beginPath(); ctx.ellipse(0, -r * 0.25, r * 0.16, r * 0.3, 0, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,240,245,0.95)'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, r * 0.45, r * 0.16, 0, 6.2832);
    ctx.fillStyle = en.hp > 1 ? 'rgba(255,220,140,0.95)' : 'rgba(255,255,255,0.75)'; ctx.fill();
    ctx.restore();
    if (en.hp > 1) {
      ctx.beginPath(); ctx.arc(en.x, en.y, r + 2.5, 0, 6.2832);
      ctx.strokeStyle = 'rgba(255,140,90,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  /* 玩家 */
  if (state !== 'over') {
    ctx.save();
    ctx.translate(player.x, player.y);
    if (player.inv > 0 && Math.floor(time * 12) % 2 === 0) { ctx.globalAlpha = 0.45; }
    /* ===== 俯视战斗机 ===== */
    var gp = ctx.createLinearGradient(0, 15, 0, -13);
    gp.addColorStop(0, '#eaf8ff');
    gp.addColorStop(0.45, '#7cc4f7');
    gp.addColorStop(1, '#2f62a8');
    /* 尾焰（先画，压在机身下面） */
    var fl = 0.6 + Math.random() * 0.4;
    ctx.beginPath();
    ctx.moveTo(-2.6, -12);
    ctx.quadraticCurveTo(0, -20 - fl * 8, 2.6, -12);
    ctx.closePath();
    var gg0 = ctx.createLinearGradient(0, -12, 0, -26);
    gg0.addColorStop(0, 'rgba(150,230,255,0.95)');
    gg0.addColorStop(1, 'rgba(90,170,255,0)');
    ctx.fillStyle = gg0; ctx.fill();
    /* 主机身 */
    ctx.beginPath();
    ctx.moveTo(0, 15);
    ctx.bezierCurveTo(2.3, 10, 2.7, 5, 2.7, 0);
    ctx.lineTo(2.7, -11);
    ctx.lineTo(-2.7, -11);
    ctx.lineTo(-2.7, 0);
    ctx.bezierCurveTo(-2.7, 5, -2.3, 10, 0, 15);
    ctx.closePath();
    ctx.fillStyle = gp; ctx.fill();
    ctx.strokeStyle = 'rgba(190,235,255,0.85)'; ctx.lineWidth = 1; ctx.stroke();
    /* 后掠主翼 */
    ctx.beginPath();
    ctx.moveTo(2.4, 2); ctx.lineTo(14, -3.5); ctx.lineTo(14, -6.5); ctx.lineTo(2.6, -3);
    ctx.closePath(); ctx.fillStyle = '#5fa9ec'; ctx.fill();
    ctx.strokeStyle = 'rgba(180,225,255,0.7)'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-2.4, 2); ctx.lineTo(-14, -3.5); ctx.lineTo(-14, -6.5); ctx.lineTo(-2.6, -3);
    ctx.closePath(); ctx.fillStyle = '#5fa9ec'; ctx.fill(); ctx.stroke();
    /* 尾翼 */
    ctx.beginPath();
    ctx.moveTo(2.2, -8); ctx.lineTo(6.6, -12.5); ctx.lineTo(6.6, -14.5); ctx.lineTo(2.2, -11.5);
    ctx.closePath(); ctx.fillStyle = '#4d93d6'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-2.2, -8); ctx.lineTo(-6.6, -12.5); ctx.lineTo(-6.6, -14.5); ctx.lineTo(-2.2, -11.5);
    ctx.closePath(); ctx.fillStyle = '#4d93d6'; ctx.fill();
    /* 座舱 */
    ctx.beginPath();
    ctx.ellipse(0, 4.5, 1.9, 4.2, 0, 0, 6.2832);
    var gc = ctx.createLinearGradient(0, 9, 0, 0);
    gc.addColorStop(0, 'rgba(220,250,255,0.95)');
    gc.addColorStop(1, 'rgba(60,120,190,0.9)');
    ctx.fillStyle = gc; ctx.fill();
    ctx.restore();
  }

  /* 粒子 */
  for (var pi = 0; pi < particles.length; pi++) {
    var p = particles[pi];
    var a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.6 + (1 - a) * 2.4, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ===================== 主循环（时间步进，60fps） ===================== */
var last = 0, acc = 0, FIXED = 1 / 120, lastAt = 0;
function tick(ts) {
  var now = (typeof ts === 'number' && ts > 0) ? ts : ((window.performance && performance.now) ? performance.now() : Date.now());
  if (!last) { last = now; }
  if (now < last) { now = last; }
  var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now; lastAt = now;
  acc = Math.min(acc + dt, 0.1);
  var guard = 0;
  while (acc >= FIXED && guard++ < 12) { update(FIXED); acc -= FIXED; }
  if (bannerTimer > 0) {
    bannerTimer -= dt;
    if (bannerTimer <= 0) { document.getElementById('banner').classList.remove('show'); }
  }
  draw();
}
function loop(ts) { tick(ts); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
setInterval(function () {
  var now = (window.performance && performance.now) ? performance.now() : Date.now();
  if (now - lastAt < 100) { return; }
  tick(now);
}, 50);

/* ===================== 事件绑定 ===================== */
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);
renderLives();
window.addEventListener('pagehide', function () { firing = false; });
</script>
