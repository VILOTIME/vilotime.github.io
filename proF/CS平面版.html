<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CS 平面战场</title>
<link rel="stylesheet" href="yc-ui.css">
<style>
  #hud { align-items: flex-start; }
  .hpwrap { display: flex; align-items: center; gap: 8px; }
  .hpbar {
    position: relative; width: clamp(64px, 16vw, 110px); height: 9px;
    border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden;
  }
  .hpbar i {
    position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
    background: linear-gradient(90deg, #38d39f, #8ef0c4);
    transition: width .12s linear;
  }
  .hpbar i.mid { background: linear-gradient(90deg, #ffd166, #ffe6a3); }
  .hpbar i.low { background: linear-gradient(90deg, #ff6b6b, #ffb199); }
  #hud b { font-variant-numeric: tabular-nums; }
  #hud .chip { white-space: nowrap; }
  /* 窄屏：HP 条缩短、中间标题隐藏，保证一行放得下 */
  @media (max-width: 640px) {
    #hud { font-size: 12px; gap: 6px; }
    #hud .chip { padding: 4px 8px; }
    #hud .chip:nth-child(2) { display: none; }
    .hpbar { width: clamp(48px, 14vw, 76px); }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="hud">
      <div class="chip">
        <div class="hpwrap"><span class="dot" style="background:#4f9cf9"></span>我方 <b id="hpMe">20</b>
          <span class="hpbar"><i id="barMe"></i></span>
        </div>
      </div>
      <div class="chip">CS 平面战场</div>
      <div class="chip">
        <div class="hpwrap"><span class="dot" style="background:#ff5d5d"></span>敌方 <b id="hpAi">20</b>
          <span class="hpbar"><i id="barAi"></i></span>
        </div>
      </div>
    </div>

    <div id="banner"></div>
    <div id="hint"></div>

    <div class="tools">
      <button class="tool-btn" id="fsBtn" type="button" title="全屏（F）">⛶ 全屏</button>
    </div>

    <div class="overlay" id="intro">
      <div class="panel">
        <h1>CS 平面战场</h1>
        <p>你和一个人机互相射击，谁先把对方血量打完谁赢（各 20 点血，中一枪 -1）。</p>
        <p><b>移动</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>　<b>瞄准</b> 鼠标　<b>开火</b> 按住左键，或按住 <kbd>Q</kbd></p>
        <p>手机：左下角方向盘移动，按住画面瞄准并开枪。</p>
        <p>绿色区域是墙，子弹打不穿。</p>
        <button class="btn" id="startBtn" type="button">开始游戏</button>
      </div>
    </div>

    <div class="overlay hidden" id="over">
      <div class="panel">
        <h1 id="overTitle">游戏结束</h1>
        <p>我方剩余 <b id="finalMe">0</b>　敌方剩余 <b id="finalAi">0</b></p>
        <p id="overComment"></p>
        <button class="btn" id="retryBtn" type="button">再来一局</button>
      </div>
    </div>

    <div class="overlay hidden" id="mobile">
      <div class="panel">
        <h1>这个游戏只能在电脑上玩</h1>
        <p>「CS 平面战场」需要键盘走位 + 鼠标瞄准射击，手机 / 平板上没法正常操作。</p>
        <p>请用电脑打开本页面，或回主页挑个手机能玩的游戏。</p>
        <button class="btn" id="mobileBack" type="button">返回主页</button>
      </div>
    </div>
  </div>
</div>

var WALL_W = 480, WALL_H = 360;
var wallMask = null;                  /* Uint8Array(480*360) */
var mapImg = new Image();
var mapReady = false;

mapImg.onload = function () {
  var c = document.createElement('canvas');
  c.width = WALL_W; c.height = WALL_H;
  var g = c.getContext('2d');
  g.drawImage(mapImg, 0, 0, WALL_W, WALL_H);

    var img = wg.createImageData(WALL_W, WALL_H);
    var d = img.data;
    for (var i = 0, p = 0; i < data.length; i += 4, p++) {
      var r = data[i], gg = data[i + 1], b = data[i + 2];

      if (g1 || g2) {
        wallMask[p] = 1;
        var t = Math.floor(p / WALL_W) / WALL_H;          /* 0 顶 → 1 底 */
        d[i] = Math.round(72 - 44 * t);
        d[i + 1] = Math.round(112 - 68 * t);
        d[i + 2] = Math.round(88 - 56 * t);
        d[i + 3] = 255;
      }
    }
    wg.putImageData(img, 0, 0);
    buildBackground(wallCv);
  } catch (e) { wallMask = null; }
  mapReady = true;
};

/* ---------- 把原版地图重新画成战术风背景（墙体位置与原版完全一致） ---------- */
var bgCanvas = null;

function buildBackground(wallCv) {
  var S = 2, W2 = W * S, H2 = H * S;
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W2;
  bgCanvas.height = H2;
  var g = bgCanvas.getContext('2d');

  /* 地面 */
  var grad = g.createLinearGradient(0, 0, W2, H2);
  grad.addColorStop(0, '#101c28');
  grad.addColorStop(0.55, '#0a1220');
  grad.addColorStop(1, '#05080f');
  g.fillStyle = grad;
  g.fillRect(0, 0, W2, H2);

  /* 地面网格 */
  g.strokeStyle = 'rgba(110,170,230,0.065)';
  g.lineWidth = 1;
  for (var gx = 0; gx <= W; gx += 20) {
    g.beginPath(); g.moveTo(gx * S, 0); g.lineTo(gx * S, H2); g.stroke();
  }
  for (var gy = 0; gy <= H; gy += 20) {
    g.beginPath(); g.moveTo(0, gy * S); g.lineTo(W2, gy * S); g.stroke();
  }

  /* 墙体投影 */
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.8)';
  g.shadowBlur = 9 * S;
  g.shadowOffsetX = 0;
  g.shadowOffsetY = 4 * S;
  g.drawImage(wallCv, 0, 0, W2, H2);
  g.restore();

  /* 墙体本体 */
  g.drawImage(wallCv, 0, 0, W2, H2);

  /* 墙体顶边高光（只作用在墙上） */
  g.save();
  g.globalCompositeOperation = 'source-atop';
  var hi = g.createLinearGradient(0, 0, 0, H2);
  hi.addColorStop(0, 'rgba(160,220,180,0.22)');
  hi.addColorStop(0.35, 'rgba(160,220,180,0.04)');
  hi.addColorStop(1, 'rgba(160,220,180,0)');
  g.fillStyle = hi;
  g.fillRect(0, 0, W2, H2);
  g.restore();

  /* 暗角 */
  var vg = g.createRadialGradient(W2 / 2, H2 / 2, W2 * 0.3, W2 / 2, H2 / 2, W2 * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W2, H2);
}
mapImg.src = MAP_SRC;

/* 两点之间是否通视（沿直线采样墙体遮罩） */
function hasLOS(x1, y1, x2, y2) {
  var d = len(x2 - x1, y2 - y1);
  var steps = Math.max(1, Math.ceil(d / 5));
  for (var i = 1; i < steps; i++) {
    var t = i / steps;
    if (isWall(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) { return false; }
  }
  return true;
}

/* 从给定方向里挑一个不会马上撞墙的（先试原方向，再向两侧偏） */
function pickFreeDir(bx, by, dir) {
  var offsets = [0, 0.35, -0.35, 0.8, -0.8, 1.3, -1.3, 1.9, -1.9, 2.6, -2.6, Math.PI];
  for (var i = 0; i < offsets.length; i++) {
    var d2 = dir + offsets[i];
    if (!isWall(bx + Math.cos(d2) * 18, by + Math.sin(d2) * 18)) { return d2; }
  }
  return dir;
}

function isWall(x, y) {
  if (!wallMask) { return false; }
  var px = Math.round(x + W / 2), py = Math.round(H / 2 - y);
  if (px < 0 || px >= WALL_W || py < 0 || py >= WALL_H) { return true; }
  return wallMask[py * WALL_W + px] === 1;
}

/* ---------- 画布 ---------- */
function resize() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var s = Math.min((vw - 24) / W, (vh - 24) / H);
  s = Math.max(0.4, s);
  var dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
  st.style.width = cv.style.width;
  st.style.height = cv.style.height;
  UNIT = s * dpr;
}

/* ---------- 状态 ---------- */
var state = 'intro';                  /* intro | playing | over */
var me, ai, aiCross, bullets, popups, particles;
var aim = { x: 0, y: 60 };            /* 准星（鼠标） */
var firing = false, qDown = false;
var keys = Object.create(null);
var bannerTimer = 0, hitFlash = 0, shake = 0;

/* 纯触屏设备（手机 / 平板）判定 */
function isTouchOnlyDevice() {
  try {
    var tp = navigator.maxTouchPoints || 0;
    var ua = navigator.userAgent || '';
    var mobileUA = /Android|iPhone|iPad|iPod|Mobile|Tablet|Silk|Kindle/i.test(ua);
    if (window.matchMedia) {
      var coarse = window.matchMedia('(pointer: coarse)').matches;
      var noHover = window.matchMedia('(hover: none)').matches;
      if (coarse && noHover) { return true; }
      if (mobileUA) { return true; }
    }
    return mobileUA || (tp > 0 && window.matchMedia && !window.matchMedia('(any-pointer: fine)').matches);
  } catch (e) { return false; }
}
var touchOnly = isTouchOnlyDevice();

var elHpMe = document.getElementById('hpMe');
var elHpAi = document.getElementById('hpAi');
var elBarMe = document.getElementById('barMe');
var elBarAi = document.getElementById('barAi');
var elBanner = document.getElementById('banner');
var elHint = document.getElementById('hint');

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function len(x, y) { return Math.sqrt(x * x + y * y); }
function rand(a, b) { return a + Math.random() * (b - a); }
function rad(d) { return d * Math.PI / 180; }

function banner(t, ms) {
  elBanner.textContent = t;
  elBanner.classList.add('show');
  bannerTimer = (ms || 900) / 1000;
}

function hud() {
  var m = Math.max(0, Math.round(me ? me.hp : HP_MAX));
  var a = Math.max(0, Math.round(ai ? ai.hp : HP_MAX));
  elHpMe.textContent = m;
  elHpAi.textContent = a;
  elBarMe.style.width = (m / HP_MAX * 100) + '%';
  elBarAi.style.width = (a / HP_MAX * 100) + '%';
  elBarMe.className = m <= 5 ? 'low' : (m <= 10 ? 'mid' : '');
  elBarAi.className = a <= 5 ? 'low' : (a <= 10 ? 'mid' : '');
}

function popup(x, y, text, color) {
  popups.push({ x: x, y: y, text: text, color: color, life: 0.8, max: 0.8 });
}

function burst(x, y, color, n, speed) {
  for (var i = 0; i < (n || 8); i++) {
    var a = Math.random() * Math.PI * 2, sp = (speed || 70) * (0.4 + Math.random());
    particles.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.2 + Math.random() * 0.28, max: 0.48, color: color, size: 1.2 + Math.random() * 1.8
    });
  }
}

/* ---------- 开局 ---------- */
function startGame() {
  if (touchOnly) { return; }
  me = { x: PLAYER_SPAWN.x, y: PLAYER_SPAWN.y, hp: HP_MAX, dir: 0, flash: 0 };
  ai = { x: AI_SPAWN.x, y: AI_SPAWN.y, hp: HP_MAX, dir: 0, flash: 0, legLeft: 0, speed: 45, aimDir: Math.PI, fireCool: 0.8, strafeDir: 1, sees: false, alert: 0 };
  aiCross = { x: -45, y: -10 };
  bullets = []; popups = []; particles = [];
  aim = { x: 0, y: 60 };
  firing = false; qDown = false;
  keys = Object.create(null);
  bannerTimer = 0; hitFlash = 0; shake = 0;
  state = 'playing';
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  elHint.textContent = 'WASD 移动 · 鼠标瞄准 · 按住左键 / Q 开火';
  banner('开始！', 800);
  hud();
}

function gameOver(win) {
  state = 'over';
  elHint.textContent = '';
  document.getElementById('overTitle').textContent = win ? '你赢了！' : '你被击败了';
  document.getElementById('finalMe').textContent = Math.max(0, Math.round(me.hp));
  document.getElementById('finalAi').textContent = Math.max(0, Math.round(ai.hp));
  document.getElementById('overComment').textContent = win
    ? '敌人被清空，干得漂亮。'
    : '注意绿色掩体后的敌人，换个角度绕过去。';
  document.getElementById('over').classList.remove('hidden');
  elBanner.classList.remove('show');
}

/* ---------- 子弹 ---------- */
function spawnBullet(owner, x, y, dir) {
  bullets.push({ owner: owner, x: x, y: y, dir: dir, speed: rand(30, 50) });
}

function stepBullets(dt) {
  for (var i = bullets.length - 1; i >= 0; i--) {
    var b = bullets[i];
    b.speed = rand(30, 50);           /* 每帧重新随机，和原版一致 */
    b.x += Math.cos(b.dir) * b.speed;
    b.y += Math.sin(b.dir) * b.speed;

    var dead = false;
    if (isWall(b.x, b.y) ||
      isWall(b.x + Math.cos(b.dir) * 3, b.y + Math.sin(b.dir) * 3)) {
      burst(b.x, b.y, b.owner === 'me' ? 'rgba(255,220,150,.85)' : 'rgba(255,150,140,.85)', 3, 60);
      dead = true;
    }
    if (!dead) {
      if (b.owner === 'me') {
        if (len(b.x - ai.x, b.y - ai.y) < 11) {
          ai.hp -= 1;
          ai.flash = 0.16;
          /* 被打了：准星立刻甩向玩家，并进入警戒 */
          ai.alert = 0.9;
          aiCross.x += (me.x - aiCross.x) * 0.55;
          aiCross.y += (me.y - aiCross.y) * 0.55;
          ai.memX = me.x;
          ai.memY = me.y;
          popup(ai.x, ai.y + 12, '-1', '#ff8a7a');
          burst(b.x, b.y, 'rgba(255,180,120,.95)', 6, 110);
          dead = true;
          hud();
        }
      } else {
        if (len(b.x - me.x, b.y - me.y) < 11) {
          me.hp -= 1;
          me.flash = 0.16;
          hitFlash = 0.2;
          shake = Math.min(4, shake + 1.6);
          popup(me.x, me.y + 12, '-1', '#7fd0ff');
          burst(b.x, b.y, 'rgba(255,110,110,.95)', 6, 110);
          dead = true;
          hud();
        }
      }
    }
    if (!dead && (b.x < -W / 2 - 20 || b.x > W / 2 + 20 || b.y < -H / 2 - 20 || b.y > H / 2 + 20)) {
      dead = true;
    }
    if (dead) { bullets.splice(i, 1); }
  }
}

/* ---------- 逻辑（30 帧/秒） ---------- */
function stepGame(dt) {
  if (bannerTimer > 0) {
    bannerTimer -= dt;
    if (bannerTimer <= 0) { elBanner.classList.remove('show'); }
  }
  if (hitFlash > 0) { hitFlash -= dt; }
  if (shake > 0) { shake = Math.max(0, shake - dt * 22); }
  if (state !== 'playing') { updateFx(dt); return; }

  /* 玩家：WASD 每帧 1 像素，朝向准星 */
  var ax = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
  var ay = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
  me.x += ax;
  me.y += ay;
  me.x = clamp(me.x, -W / 2 + 6, W / 2 - 6);
  me.y = clamp(me.y, -H / 2 + 6, H / 2 - 6);
  me.dir = Math.atan2(aim.y - me.y, aim.x - me.x);

  /* 开火：按住左键或 Q */
  if (firing || qDown) {
    var gx = me.x + Math.cos(me.dir) * 11;
    var gy = me.y + Math.sin(me.dir) * 11;
    spawnBullet('me', gx, gy, me.dir + rand(-0.02, 0.02));
  }

  /* ================= 人机 AI ================= */
  var seen = hasLOS(ai.x, ai.y, me.x, me.y);
  ai.sees = seen;
  if (seen) { ai.memX = me.x; ai.memY = me.y; }      /* 记住最后看到的位置 */
  ai.fireCool -= dt;
  if (ai.alert > 0) { ai.alert -= dt; }
  if (ai.flash > 0) { ai.flash -= dt; }

  /* 被子弹擦身而过就立刻换向侧闪 */
  if (ai.legLeft > 0.05) {
    for (var bi = 0; bi < bullets.length; bi++) {
      var bb = bullets[bi];
      if (bb.owner === 'me' && len(bb.x - ai.x, bb.y - ai.y) < 34) {
        ai.legLeft = 0;
        ai.strafeDir = -ai.strafeDir;
        break;
      }
    }
  }

  /* 走位：有视野就保持交火距离并侧移，没视野就朝记忆点推进 */
  if (ai.legLeft <= 0) {
    var toP = Math.atan2(me.y - ai.y, me.x - ai.x);
    var dist2 = len(me.x - ai.x, me.y - ai.y);
    var baseDir;
    if (seen) {
      if (dist2 < 80) { baseDir = toP + Math.PI + rand(-0.45, 0.45); }        /* 太近后撤 */
      else if (dist2 > 190) { baseDir = toP + rand(-0.35, 0.35); }            /* 太远压上 */
      else { baseDir = toP + ai.strafeDir * Math.PI / 2 + rand(-0.5, 0.5); }  /* 中距离侧移 */
      if (Math.random() < 0.22) { ai.strafeDir = -ai.strafeDir; }
    } else {
      var mx = ai.memX === undefined ? me.x : ai.memX;
      var my = ai.memY === undefined ? me.y : ai.memY;
      baseDir = Math.atan2(my - ai.y, mx - ai.x) + rand(-0.55, 0.55);
    }
    ai.dir = pickFreeDir(ai.x, ai.y, baseDir);
    ai.legLeft = rand(30, 52);
  }
  var stp = Math.min(ai.legLeft, AI_SPEED * dt);          /* 与人机同速：和玩家一样每秒 30 像素 */
  ai.x += Math.cos(ai.dir) * stp;
  ai.y += Math.sin(ai.dir) * stp;
  ai.legLeft -= stp;
  ai.x = clamp(ai.x, -W / 2 + 6, W / 2 - 6);
  ai.y = clamp(ai.y, -H / 2 + 6, H / 2 - 6);

  /* 准星：有视野时锁玩家（快一点），没视野时朝记忆点摸索 */
  var alerting = ai.alert > 0;                 /* 刚被打过：立刻反击 */
  var tx = (seen || alerting) ? me.x : (ai.memX === undefined ? me.x : ai.memX);
  var ty = (seen || alerting) ? me.y : (ai.memY === undefined ? me.y : ai.memY);
  var ddx = tx - aiCross.x, ddy = ty - aiCross.y;
  var dd = len(ddx, ddy);
  var crossSpd = alerting ? 3.4 : (seen ? 1.15 : 0.75);
  if (dd > 0.0001) {
    aiCross.x += ddx / dd * crossSpd;
    aiCross.y += ddy / dd * crossSpd;
  }

  /* 人物始终朝着自己的准星 */
  ai.aimDir = Math.atan2(aiCross.y - ai.y, aiCross.x - ai.x);

  /* 准星贴上玩家、且真的看得见（不隔墙开枪），就点射 */
  if (seen && len(me.x - aiCross.x, me.y - aiCross.y) < (alerting ? 18 : 12) && ai.fireCool <= 0) {
    var gx2 = ai.x + Math.cos(ai.aimDir) * 11;
    var gy2 = ai.y + Math.sin(ai.aimDir) * 11;
    spawnBullet('ai', gx2, gy2, ai.aimDir + rand(-0.03, 0.03));
    ai.fireCool = 0.16;
  }

  stepBullets(dt);

  if (me.hp < 1) { gameOver(false); return; }
  if (ai.hp < 1) { gameOver(true); return; }

  updateFx(dt);
}

function updateFx(dt) {
  for (var i = popups.length - 1; i >= 0; i--) {
    var p = popups[i];
    p.y += 26 * dt;
    p.life -= dt;
    if (p.life <= 0) { popups.splice(i, 1); }
  }
  for (var j = particles.length - 1; j >= 0; j--) {
    var pt = particles[j];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= (1 - dt * 3); pt.vy *= (1 - dt * 3);
    pt.life -= dt;
    if (pt.life <= 0) { particles.splice(j, 1); }
  }
  if (me && me.flash > 0) { me.flash -= dt; }
}

/* ---------- 绘制 ---------- */
function drawMap() {
  if (bgCanvas) {
    ctx.drawImage(bgCanvas, -W / 2, -H / 2, W, H);
  } else {
    ctx.fillStyle = '#0a1220';
    ctx.fillRect(-W / 2, -H / 2, W, H);
  }
}

function drawAgent(x, y, ang, hostile, flash) {
  var r = 9;
  var body = hostile ? (flash ? '#ffd9d2' : '#c2453a') : (flash ? '#ffd0d0' : '#3f5f8f');
  var helm = hostile ? (flash ? '#ffe8e2' : '#8c2b22') : (flash ? '#ffe0e0' : '#2b4468');

  ctx.beginPath();
  ctx.ellipse(x + 1, y - 1.5, r * 0.95, r * 0.85, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);

  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.92, r * 0.8, 0, 0, Math.PI * 2);
  ctx.fillStyle = body;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(3, 0, r * 0.46, 0, Math.PI * 2);
  ctx.fillStyle = helm;
  ctx.fill();

  ctx.fillStyle = '#22293a';
  ctx.fillRect(r * 0.55, -1.3, r * 1.15, 2.6);

  ctx.restore();
}

function drawBulletsLayer() {
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    var tx = b.x - Math.cos(b.dir) * 10, ty = b.y - Math.sin(b.dir) * 10;
    ctx.strokeStyle = b.owner === 'me' ? 'rgba(255,215,120,0.95)' : 'rgba(255,120,110,0.95)';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }
}

function drawAim() {
  var x = aim.x, y = aim.y;
  ctx.strokeStyle = 'rgba(79,156,249,0.95)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(79,156,249,0.95)'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 14, y); ctx.lineTo(x - 10, y);
  ctx.moveTo(x + 10, y); ctx.lineTo(x + 14, y);
  ctx.moveTo(x, y - 14); ctx.lineTo(x, y - 10);
  ctx.moveTo(x, y + 10); ctx.lineTo(x, y + 14);
  ctx.stroke();
}

function drawText(s, x, y, size, color, bold) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, -1);
  ctx.fillStyle = color;
  ctx.font = (bold ? 'bold ' : '') + size + 'px "PingFang SC", "Microsoft YaHei", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, 0, 0);
  ctx.restore();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);

  var ox = 0, oy = 0;
  if (shake > 0.05) { ox = rand(-shake, shake); oy = rand(-shake, shake); }
  ctx.setTransform(UNIT, 0, 0, -UNIT, cv.width / 2 + ox * UNIT, cv.height / 2 + oy * UNIT);

  drawMap();
  if (state === 'playing' || state === 'over') {
    if (ai) { drawAgent(ai.x, ai.y, ai.aimDir === undefined ? ai.dir : ai.aimDir, true, ai.flash > 0); }
    if (me) { drawAgent(me.x, me.y, me.dir, false, me.flash > 0); }

    drawBulletsLayer();
  }

  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.8), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (var j = 0; j < popups.length; j++) {
    var pp = popups[j];
    var pa = Math.max(0, pp.life / pp.max);
    ctx.globalAlpha = pa;
    drawText(pp.text, pp.x, pp.y, 15, pp.color, true);
  }
  ctx.globalAlpha = 1;

  if (state === 'playing') { drawAim(); }

  if (hitFlash > 0) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    var va = Math.min(0.38, hitFlash * 1.5);
    var vg = ctx.createRadialGradient(cv.width / 2, cv.height / 2, cv.width * 0.22, cv.width / 2, cv.height / 2, cv.width * 0.72);
    vg.addColorStop(0, 'rgba(255,60,60,0)');
    vg.addColorStop(1, 'rgba(255,60,60,' + va.toFixed(3) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
}

/* ---------- 主循环：逻辑 30Hz，渲染跟随刷新率 ---------- */
var last = 0, acc = 0, lastAt = 0;
function tick(ts) {
  var now = (typeof ts === 'number' && ts > 0) ? ts : ((window.performance && performance.now) ? performance.now() : Date.now());
  if (!last) { last = now; }
  if (now < last) { now = last; }
  var dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
  last = now;
  lastAt = now;
  acc = Math.min(acc + dt, 0.25);
  var guard = 0;
  while (acc >= TICK && guard++ < 8) { stepGame(TICK); acc -= TICK; }
  if (acc < 0) { acc = 0; }
  draw();
}
function loop(ts) { tick(ts); requestAnimationFrame(loop); }

/* ---------- 输入 ---------- */
function pointerToUnits(e) {
  var rect = cv.getBoundingClientRect();
  var px = (e.clientX - rect.left) / rect.width;
  var py = (e.clientY - rect.top) / rect.height;
  return { x: px * W - W / 2, y: H / 2 - py * H };
}

cv.addEventListener('pointermove', function (e) {
  var p = pointerToUnits(e);
  aim.x = p.x; aim.y = p.y;
});
cv.addEventListener('pointerdown', function (e) {
  var p = pointerToUnits(e);
  aim.x = p.x; aim.y = p.y;
  firing = true;
  e.preventDefault();
});
window.addEventListener('pointerup', function () { firing = false; });
cv.addEventListener('pointercancel', function () { firing = false; });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

window.addEventListener('keydown', function (e) {
  var k = (e.key || '').toLowerCase();
  if (k === 'w' || k === 'a' || k === 's' || k === 'd') { keys[k] = true; e.preventDefault(); }
  else if (k === 'arrowup') { keys.w = true; e.preventDefault(); }
  else if (k === 'arrowdown') { keys.s = true; e.preventDefault(); }
  else if (k === 'arrowleft') { keys.a = true; e.preventDefault(); }
  else if (k === 'arrowright') { keys.d = true; e.preventDefault(); }
  else if (k === 'q') { qDown = true; e.preventDefault(); }
  else if (k === 'f') { toggleFullscreen(); }
  else if (k === 'enter' && (state === 'intro' || state === 'over')) { startGame(); }
});
window.addEventListener('keyup', function (e) {
  var k = (e.key || '').toLowerCase();
  if (k === 'w' || k === 'a' || k === 's' || k === 'd') { keys[k] = false; }
  else if (k === 'arrowup') { keys.w = false; }
  else if (k === 'arrowdown') { keys.s = false; }
  else if (k === 'arrowleft') { keys.a = false; }
  else if (k === 'arrowright') { keys.d = false; }
  else if (k === 'q') { qDown = false; }
});
window.addEventListener('blur', function () {
  keys = Object.create(null);
  firing = false; qDown = false;
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

/* ---------- 全屏 ---------- */
var fsBtn = document.getElementById('fsBtn');
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFullscreen() {
  var el = document.documentElement;
  if (!isFull()) {
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { req.call(el).catch(function () {}); }
  } else {
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) { exit.call(document).catch(function () {}); }
  }
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', function () { setTimeout(resize, 60); });

/* ---------- 启动 ---------- */
if (touchOnly) {
  state = 'blocked';
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('mobile').classList.remove('hidden');
  document.getElementById('mobileBack').addEventListener('click', function () {
    location.href = '主页.html';
  });
}
me = { x: PLAYER_SPAWN.x, y: PLAYER_SPAWN.y, hp: HP_MAX, dir: 0, flash: 0 };
ai = { x: AI_SPAWN.x, y: AI_SPAWN.y, hp: HP_MAX, dir: 0, flash: 0, legLeft: 0, speed: 45, aimDir: Math.PI, fireCool: 0.8, strafeDir: 1, sees: false, alert: 0 };
aiCross = { x: -45, y: -10 };
bullets = []; popups = []; particles = [];
hud();
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
requestAnimationFrame(loop);
setInterval(function () {
  var now = (window.performance && performance.now) ? performance.now() : Date.now();
  if (now - lastAt < 100) { return; }
  tick(now);
}, 50);
</script>
