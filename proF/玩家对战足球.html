<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玩家对战足球</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #10151c;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", Arial, sans-serif;
    color: #eaeff7;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #stage { position: relative; max-width: 100%; max-height: 100%; }
  canvas { display: block; border-radius: 12px; box-shadow: 0 18px 44px rgba(0,0,0,.55); background: #16301a; }
  #hud {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    padding: 6px 16px; border-radius: 999px;
    background: rgba(10,16,24,.62); border: 1px solid rgba(255,255,255,.14);
    font-size: 15px; letter-spacing: 1px; white-space: nowrap;
  }
  #hud .tag { display: flex; align-items: center; gap: 6px; font-weight: 700; }
  #hud .dot { width: 11px; height: 11px; border-radius: 50%; }
  #hud .score { font-variant-numeric: tabular-nums; }
  #hud .vs { opacity: .5; }
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8,12,18,.78); backdrop-filter: blur(3px);
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .card {
    width: min(560px, 100%);
    background: linear-gradient(180deg, #1b2432, #141b26);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 16px;
    padding: 22px 24px 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
  }
  .card h1 { margin: 0 0 4px; font-size: 21px; letter-spacing: 1px; }
  .card .sub { margin: 0 0 16px; font-size: 12px; color: #93a4bb; letter-spacing: .5px; }
  .row { display: flex; align-items: flex-start; gap: 12px; margin: 12px 0; }
  .pill {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 700;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
  }
  .pill .dot { width: 11px; height: 11px; border-radius: 50%; }
  .keys { display: flex; gap: 6px; flex-wrap: wrap; }
  kbd {
    display: inline-block; min-width: 24px; text-align: center;
    padding: 3px 7px; border-radius: 6px; font-size: 12px; font-weight: 700;
    background: #253247; border: 1px solid #3a4c69; border-bottom-width: 3px;
    color: #dce7f7; font-family: inherit;
  }
  .desc { font-size: 13px; line-height: 1.6; color: #b9c7db; }
  .desc b { color: #fff; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  button {
    font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 1px;
    padding: 10px 20px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent; transition: transform .12s ease, background-color .2s ease, border-color .2s ease;
  }
  button:active { transform: scale(.97); }
  #start { flex: 1; background: #2f7bf6; border-color: #2f7bf6; color: #fff; }
  #start:hover { background: #3d88ff; }
  #howto { background: transparent; border-color: rgba(255,255,255,.25); color: #cfe0f7; }
  #howto:hover { border-color: #4f9cf9; }
  #mobileBox { text-align: center; }
  #mobileBox .big { font-size: 44px; margin-bottom: 10px; }
  #mobileBox h1 { font-size: 20px; margin: 0 0 10px; }
  #mobileBox p { color: #a9b8cd; font-size: 13px; line-height: 1.7; margin: 0; }
  #msg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 40px; font-weight: 800; letter-spacing: 4px; color: #fff;
    text-shadow: 0 6px 24px rgba(0,0,0,.7);
    opacity: 0; transition: opacity .18s ease; pointer-events: none;
  }
  #msg.show { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <span class="tag"><span class="dot" style="background:#4f9cf9"></span>玩家1</span>
      <span class="score"><span id="s1">0</span> : <span id="s2">0</span></span>
      <span class="tag"><span class="dot" style="background:#ff5d5d"></span>玩家2</span>
    </div>
    <div id="msg"></div>
  </div>
</div>

<div id="intro" class="overlay">
  <div class="card">
    <h1>玩家对战足球</h1>
    <p class="sub">同一台电脑 · 双人对战 · 仅支持电脑（需要键盘）</p>
    <div class="row">
      <span class="pill"><span class="dot" style="background:#4f9cf9"></span>玩家1（蓝）</span>
      <div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
    </div>
    <div class="row">
      <span class="pill"><span class="dot" style="background:#ff5d5d"></span>玩家2（红）</span>
      <div class="keys"><kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd></div>
    </div>
    <div class="desc">
      <b>玩法：</b>用圆圈把球撞进对方球门得分，先到 <b>5 分</b> 获胜。<br>
      <b>玩家1</b> 守左边球门、进攻右边；<b>玩家2</b> 守右边球门、进攻左边。<br>
      <b>Esc</b> 重新打开本说明，<b>R</b> 重新开始比赛。
    </div>
    <div class="actions">
      <button id="start" type="button">开始游戏</button>
      <button id="howto" type="button">关闭</button>
    </div>
  </div>
</div>

<div id="mobile" class="overlay hidden">
  <div class="card" id="mobileBox">
    <div class="big">🖥️</div>
    <h1>这个游戏只能在电脑上玩</h1>
    <p>「玩家对战足球」需要两个人在同一台电脑上各用一半键盘对战，<br>手机 / 平板没有键盘，无法游玩。<br><br>请用电脑打开本页面，或回到主页选择其他游戏。</p>
    <div class="actions" style="justify-content:center">
      <button id="backHome" type="button" style="background:#2f7bf6;border-color:#2f7bf6;color:#fff">返回主页</button>
    </div>
  </div>
</div>

/* ============ 设备判断：仅电脑可玩 ============ */
function isTouchOnlyDevice() {
  try {
    var tp = navigator.maxTouchPoints || 0;
    var ua = navigator.userAgent || '';
    var mobileUA = /Android|iPhone|iPad|iPod|Mobile|Tablet|Silk|Kindle/i.test(ua);
    if (window.matchMedia) {
      var coarse = window.matchMedia('(pointer: coarse)').matches;
      var noHover = window.matchMedia('(hover: none)').matches;
      if (coarse && noHover) { return true; }
      if (mobileUA) { return true; }
    }
    return mobileUA || tp > 0 && !window.matchMedia('(any-pointer: fine)').matches;
  } catch (e) { return false; }
}
var touchOnly = isTouchOnlyDevice();

/* ============ 画布 ============ */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var UNIT = 2;               /* 1 游戏单位 = 2 像素 */
var fieldImg = new Image();
fieldImg.src = FIELD_SRC;

function resize() {
  var pad = 32;
  var availW = Math.max(200, window.innerWidth - pad);
  var availH = Math.max(150, window.innerHeight - pad);
  var scale = Math.min(availW / 480, availH / 360);
  cv.width = Math.round(480 * scale * (window.devicePixelRatio || 1));
  cv.height = Math.round(360 * scale * (window.devicePixelRatio || 1));
  cv.style.width = Math.round(480 * scale) + 'px';
  cv.style.height = Math.round(360 * scale) + 'px';
  UNIT = cv.width / 480;
}
window.addEventListener('resize', resize);
resize();

/* ============ 游戏状态 ============ */
var state = 'intro';       /* intro | playing | goal | over */
var keys = Object.create(null);
var score = { p1: 0, p2: 0 };
var goalTimer = 0;

function makePlayer(cx, color) {
  return { x: cx, y: 0, vx: 0, vy: 0, r: PLAYER_R, color: color };
}
var p1 = makePlayer(-150, '#4f9cf9');
var p2 = makePlayer(150, '#ff5d5d');
var ball = { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R };

function resetPositions(dir) {
  p1.x = -150; p1.y = 0; p1.vx = 0; p1.vy = 0;
  p2.x = 150; p2.y = 0; p2.vx = 0; p2.vy = 0;
  ball.x = 0; ball.y = 0; ball.vx = dir * 40; ball.vy = 0;
}

/* ============ 输入 ============ */
var KEY_MAP = {
  w: ['p1', 'up'], a: ['p1', 'left'], s: ['p1', 'down'], d: ['p1', 'right'],
  i: ['p2', 'up'], j: ['p2', 'left'], k: ['p2', 'down'], l: ['p2', 'right']
};
window.addEventListener('keydown', function (e) {
  var k = (e.key || '').toLowerCase();
  if (KEY_MAP[k]) { keys[k] = true; e.preventDefault(); }
  if (k === 'escape') { showIntro(); e.preventDefault(); }
  if (k === 'r') { restart(); e.preventDefault(); }
});
window.addEventListener('keyup', function (e) {
  var k = (e.key || '').toLowerCase();
  if (KEY_MAP[k]) { keys[k] = false; e.preventDefault(); }
});
window.addEventListener('blur', function () { keys = Object.create(null); });

/* ============ 物理 ============ */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function len(x, y) { return Math.sqrt(x * x + y * y); }

function movePlayer(p, up, down, left, right, dt) {
  var ax = (right ? 1 : 0) - (left ? 1 : 0);
  var ay = (up ? 1 : 0) - (down ? 1 : 0);
  if (ax || ay) {
    var l = len(ax, ay);
    p.vx += (ax / l) * PLAYER_ACC * dt;
    p.vy += (ay / l) * PLAYER_ACC * dt;
  }
  var damp = Math.max(0, 1 - PLAYER_DRAG * dt);
  p.vx *= damp; p.vy *= damp;
  var sp = len(p.vx, p.vy);
  if (sp > PLAYER_MAX) { p.vx = p.vx / sp * PLAYER_MAX; p.vy = p.vy / sp * PLAYER_MAX; }
  p.x += p.vx * dt; p.y += p.vy * dt;
  /* 边界 */
  if (p.x < FIELD.left + p.r) { p.x = FIELD.left + p.r; p.vx = -p.vx * 0.3; }
  if (p.x > FIELD.right - p.r) { p.x = FIELD.right - p.r; p.vx = -p.vx * 0.3; }
  if (p.y < FIELD.bottom + p.r) { p.y = FIELD.bottom + p.r; p.vy = -p.vy * 0.3; }
  if (p.y > FIELD.top - p.r) { p.y = FIELD.top - p.r; p.vy = -p.vy * 0.3; }
}

function collidePlayers(a, b) {
  var dx = b.x - a.x, dy = b.y - a.y, d = len(dx, dy), min = a.r + b.r;
  if (d === 0 || d >= min) { return; }
  var nx = dx / d, ny = dy / d, overlap = (min - d) / 2;
  a.x -= nx * overlap; a.y -= ny * overlap;
  b.x += nx * overlap; b.y += ny * overlap;
  var avn = a.vx * nx + a.vy * ny, bvn = b.vx * nx + b.vy * ny;
  if (avn - bvn > 0) {
    var imp = (avn - bvn) * (1 + PLAYER_REST) / 2;
    a.vx -= imp * nx; a.vy -= imp * ny;
    b.vx += imp * nx; b.vy += imp * ny;
  }
}

function collideBall(p) {
  var dx = ball.x - p.x, dy = ball.y - p.y, d = len(dx, dy), min = ball.r + p.r;
  if (d === 0 || d >= min) { return; }
  var nx = dx / d, ny = dy / d;
  ball.x = p.x + nx * min;
  ball.y = p.y + ny * min;
  var rvx = ball.vx - p.vx, rvy = ball.vy - p.vy;
  var vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    ball.vx -= (1 + 0.92) * vn * nx;
    ball.vy -= (1 + 0.92) * vn * ny;
  }
  ball.vx += nx * KICK_PUSH * 0.06 + p.vx * 0.35;
  ball.vy += ny * KICK_PUSH * 0.06 + p.vy * 0.35;
}

function stepBall(dt) {
  var damp = Math.max(0, 1 - BALL_DRAG * dt);
  ball.vx *= damp; ball.vy *= damp;
  var sp = len(ball.vx, ball.vy);
  if (sp > BALL_MAX) { ball.vx = ball.vx / sp * BALL_MAX; ball.vy = ball.vy / sp * BALL_MAX; }
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;

  var inGoalBand = Math.abs(ball.y) <= GOAL_HALF;
  /* 上下墙 */
  if (ball.y + ball.r > FIELD.top) { ball.y = FIELD.top - ball.r; ball.vy = -ball.vy * BALL_REST; }
  if (ball.y - ball.r < FIELD.bottom) { ball.y = FIELD.bottom + ball.r; ball.vy = -ball.vy * BALL_REST; }
  /* 左右墙（球门开口放行） */
  if (!inGoalBand) {
    if (ball.x + ball.r > FIELD.right) { ball.x = FIELD.right - ball.r; ball.vx = -ball.vx * BALL_REST; }
    if (ball.x - ball.r < FIELD.left) { ball.x = FIELD.left + ball.r; ball.vx = -ball.vx * BALL_REST; }
  }
}

function update(dt) {
  if (state !== 'playing') {
    if (state === 'goal') {
      goalTimer -= dt;
      if (goalTimer <= 0) {
        if (score.p1 >= WIN_SCORE || score.p2 >= WIN_SCORE) { state = 'over'; showMsg(score.p1 >= WIN_SCORE ? '玩家1 获胜！' : '玩家2 获胜！', 9999); }
        else { resetPositions(0); state = 'playing'; hideMsg(); }
      }
    }
    return;
  }
  movePlayer(p1, keys.w, keys.s, keys.a, keys.d, dt);
  movePlayer(p2, keys.i, keys.k, keys.j, keys.l, dt);
  collidePlayers(p1, p2);
  stepBall(dt);
  collideBall(p1);
  collideBall(p2);

  var inGoalBand = Math.abs(ball.y) <= GOAL_HALF;
  if (inGoalBand && ball.x - ball.r < FIELD.left - 6) { onGoal('p2'); }
  else if (inGoalBand && ball.x + ball.r > FIELD.right + 6) { onGoal('p1'); }
}

function onGoal(who) {
  if (state !== 'playing') { return; }
  if (who === 'p1') { score.p1++; } else { score.p2++; }
  document.getElementById('s1').textContent = score.p1;
  document.getElementById('s2').textContent = score.p2;
  showMsg(who === 'p1' ? '玩家1 得分！' : '玩家2 得分！', 2200);
  state = 'goal';
  goalTimer = 1.4;
  ball.vx = 0; ball.vy = 0;
  if (score.p1 >= WIN_SCORE || score.p2 >= WIN_SCORE) {
    state = 'over';
    showMsg(score.p1 >= WIN_SCORE ? '玩家1 获胜！' : '玩家2 获胜！', 9999);
  }
}

/* ============ 绘制 ============ */
function draw() {
  var w = cv.width, h = cv.height;
  if (fieldImg.complete && fieldImg.naturalWidth) {
    ctx.drawImage(fieldImg, 0, 0, w, h);
  } else {
    ctx.fillStyle = '#1f5b2a'; ctx.fillRect(0, 0, w, h);
  }
  ctx.save();
  ctx.setTransform(UNIT, 0, 0, -UNIT, w / 2, h / 2);   /* Y 轴向上，和游戏坐标一致（W 向上） */

  function disc(x, y, r, fill, ring) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    if (ring) { ctx.lineWidth = 3; ctx.strokeStyle = ring; ctx.stroke(); }
  }

  /* 球 */
  disc(ball.x, ball.y, ball.r, '#ffffff', '#1b2430');
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r * 0.42, 0, Math.PI * 2);
  ctx.fillStyle = '#1b2430';
  ctx.fill();

  /* 玩家 */
  disc(p1.x, p1.y, p1.r, p1.color, '#ffffff');
  disc(p2.x, p2.y, p2.r, p2.color, '#ffffff');

  ctx.restore();
}

/* ============ 主循环 ============ */
var last = 0, acc = 0, FIXED = 1 / 120, lastAt = 0;
function tick(ts) {
  var now = (typeof ts === 'number' && ts > 0) ? ts : ((window.performance && performance.now) ? performance.now() : Date.now());
  if (!last) { last = now; }
  if (now < last) { now = last; }          /* 时间倒退保护（rAF 与定时器时间基准可能不一致） */
  var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  lastAt = now;
  acc = Math.min(acc + dt, 0.1);           /* 累积上限，避免一次性补跑太多 */
  var guard = 0;
  while (acc >= FIXED && guard++ < 12) { update(FIXED); acc -= FIXED; }
  if (acc < 0) { acc = 0; }
  draw();
}
function loop(ts) { tick(ts); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
/* 兜底：后台标签页或没有合成器的环境里 requestAnimationFrame 不会触发，用定时器保证游戏继续跑 */
setInterval(function () {
  var now = (window.performance && performance.now) ? performance.now() : Date.now();
  if (now - lastAt < 100) { return; }
  tick(now);
}, 50);

/* ============ 界面 ============ */
var intro = document.getElementById('intro');
var mobile = document.getElementById('mobile');
var msg = document.getElementById('msg');
var msgTimer = null;
function showMsg(text, ms) {
  msg.textContent = text;
  msg.classList.add('show');
  if (msgTimer) { clearTimeout(msgTimer); }
  if (ms) { msgTimer = setTimeout(hideMsg, ms); }
}
function hideMsg() { msg.classList.remove('show'); }
function showIntro() {
  if (touchOnly) { return; }
  intro.classList.remove('hidden');
  state = 'intro';
}
function startGame() {
  intro.classList.add('hidden');
  score.p1 = 0; score.p2 = 0;
  document.getElementById('s1').textContent = 0;
  document.getElementById('s2').textContent = 0;
  resetPositions(1);
  hideMsg();
  state = 'playing';
}
function restart() {
  if (state === 'intro' || touchOnly) { return; }
  startGame();
}
document.getElementById('start').addEventListener('click', startGame);
document.getElementById('howto').addEventListener('click', function () {
  intro.classList.add('hidden');
  if (state === 'intro') { startGame(); }
});
document.getElementById('backHome').addEventListener('click', function () {
  location.href = '主页.html';
});
window.addEventListener('keydown', function (e) {
  if (state === 'intro' && !touchOnly && (e.key === 'Enter' || e.key === ' ')) { startGame(); }
});

if (touchOnly) {
  mobile.classList.remove('hidden');
  intro.classList.add('hidden');
  state = 'blocked';
}
</script>
</body>
</html>
