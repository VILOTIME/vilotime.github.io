  </g>

  <text x="128" y="130" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="112" font-weight="700" fill="#ffffff" fill-opacity="0.96">V</text>
