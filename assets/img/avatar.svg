      <stop offset="0%" stop-color="#5b7bff"/>
      <stop offset="52%" stop-color="#9d6bff"/>
      <stop offset="100%" stop-color="#2fd3bd"/>
    </linearGradient>
    <radialGradient id="b" cx="0.28" cy="0.22" r="0.75">
