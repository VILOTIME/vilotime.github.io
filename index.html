<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- 标题 / 描述 / 分享收藏卡片：由 script/sync-html.js 从 profile.json 的 meta 生成，别手改这个区间 -->
<!-- profile:meta:start -->
<title>时光不语 · 个人主页</title>
<meta name="description" content="时光不语 的个人主页 —— 头像、简介，以及各个分站点的入口。" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="时光不语" />
<meta property="og:title" content="时光不语 · 个人主页" />
<meta property="og:description" content="时光不语 的个人主页 —— 头像、简介，以及各个分站点的入口。" />
<meta property="og:url" content="https://vilotime.github.io/" />
<meta property="og:image" content="https://vilotime.github.io/assets/img/og-cover.png" />
<meta property="og:image:width" content="800" />
<meta property="og:image:height" content="800" />
<meta property="og:image:alt" content="时光不语 · 个人主页" />

<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="时光不语 · 个人主页" />
<meta name="twitter:description" content="时光不语 的个人主页 —— 头像、简介，以及各个分站点的入口。" />
<meta name="twitter:image" content="https://vilotime.github.io/assets/img/og-cover.png" />
<!-- profile:meta:end -->

<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />

<!-- 网页图标 + 头像预载：由 script/sync-html.js 从 profile.json 生成，别手改这个区间 -->
<!-- profile:icons:start -->
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
<link rel="preload" as="image" href="assets/img/avatar-400.jpg" fetchpriority="high" />
<!-- profile:icons:end -->
<link rel="stylesheet" href="assets/css/style.css" />
<!-- 没有 JS 时也要能看到内容（入场动效依赖 JS 添加 is-visible） -->
<noscript><style>.reveal{opacity:1 !important;transform:none !important}.theme-toggle{display:none}</style></noscript>
</head>
<body>

<!-- 背景装饰层 -->
<div class="bg" aria-hidden="true">
  <div class="bg__blob bg__blob--1"></div>
  <div class="bg__blob bg__blob--2"></div>
  <div class="bg__blob bg__blob--3"></div>
  <div class="bg__grid"></div>
</div>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色 / 浅色模式">
  <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
  </svg>
  <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2" />
    <path d="M12 2.2v2.4M12 19.4v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.2 12h2.4M19.4 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7" />
  </svg>
</button>

<main class="page">

  <!-- ===== 个人资料 ===== -->
  <header class="profile reveal">
    <div class="avatar">
      <div class="avatar__ring"></div>
      <!-- 头像：由 script/sync-html.js 从 profile.json 生成，别手改这个区间 -->
      <!-- profile:avatar:start -->
      <img class="avatar__img" src="assets/img/avatar-400.jpg" alt="时光不语的头像" width="140" height="140" fetchpriority="high" />
      <!-- profile:avatar:end -->
      <span class="avatar__badge" title="在线">open</span>
    </div>

    <h1 class="profile__name">
      时光不语.
      <span class="profile__handle">@vilotime</span>
    </h1>

    <p class="profile__tagline">生活中的积累，永远是在点滴</p>

    <ul class="chips" aria-label="关注方向">
      <li class="chip">电子信息</li>
      <li class="chip">Vibe Coding</li>
      <li class="chip">C++算法</li>
      <li class="chip">长期主义</li>
    </ul>

    <div class="profile__actions">
      <a class="btn btn--primary" href="#sites">
        浏览分站点
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12.5 5.5 19 12l-6.5 6.5" /></svg>
      </a>
      <!-- 联系我按钮：由 script/sync-html.js 从 profile.json 的 links.email 生成 -->
      <!-- profile:contact:start -->
      <a class="btn btn--ghost" href="mailto:vilo.time@petalmail.com" data-copy="vilo.time@petalmail.com">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="m3.5 7 8.5 6 8.5-6" /></svg>
        联系我
      </a>
      <!-- profile:contact:end -->
    </div>
  </header>

  <!-- ===== 分站点跳转 ===== -->
  <section class="sites" id="sites" aria-labelledby="sitesTitle">
    <div class="section-head reveal">
      <h2 class="section-head__title" id="sitesTitle">分站点</h2>
    </div>
    <div class="site-grid" id="siteGrid">
      <!-- sites:start -->
      <a class="site reveal" href="https://vilotime.github.io/blogs/">
        <span class="site__icon" style="--tint: 109 140 255">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16M4 12h16M4 18.5h10" /></svg>
        </span>
        <span class="site__body">
          <span class="site__title">个人博客</span>
          <span class="site__desc">随笔与专栏</span>
        </span>
        <span class="site__tag">blog</span>
        <svg class="site__arrow icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" /></svg>
      </a>
      <a class="site reveal" href="https://vilotime.github.io/games/">
        <span class="site__icon" style="--tint: 160 107 255">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="12" rx="2.5" /><path d="M8 20h8M12 16.5V20" /></svg>
        </span>
        <span class="site__body">
          <span class="site__title">叶初小游戏</span>
          <span class="site__desc">浏览器在线小游戏</span>
        </span>
        <span class="site__tag">works</span>
        <svg class="site__arrow icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" /></svg>
      </a>
      <!-- sites:end -->
      <!-- ↑ 这个区间由 script/sync-html.js 从 sites.json 生成，手改会被下次同步覆盖 -->
    </div>
  </section>

  <footer class="footer reveal">
    <nav class="footer__links" aria-label="外部链接">
      <!-- 页脚链接：由 script/sync-html.js 从 profile.json 的 links 生成，别手改这个区间 -->
      <!-- profile:links:start -->
      <a href="https://github.com/VILOTIME" target="_blank" rel="noopener noreferrer">GitHub</a>
      <span class="footer__sep" aria-hidden="true">·</span>
      <a href="mailto:vilo.time@petalmail.com" data-copy="vilo.time@petalmail.com">Email</a>
      <span class="footer__sep" aria-hidden="true">·</span>
      <a href="https://github.com/VILOTIME/vilotime.github.io/commits/main.atom" target="_blank" rel="noopener noreferrer">RSS</a>
      <!-- profile:links:end -->
    </nav>
  </footer>

</main>

<script src="script/sites.js"></script>
<script src="script/main.js"></script>
</body>
</html>
