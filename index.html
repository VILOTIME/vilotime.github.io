<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叶初小游戏</title>
    <style>
        /* 在这里添加CSS样式 */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            -webkit-text-size-adjust: 100%;
        }
        .sidebar {
            width: 200px;
            background-color: #f1f1f1;
            padding: 10px;
            box-sizing: border-box;
        }
        .sidebar a {
            display: block;
            padding: 5px;
            text-decoration: none;
            color: black;
        }
        .sidebar a:hover {
            background-color: #ddd;
        }
        .content {
            flex-grow: 1;
            padding: 10px;
            box-sizing: border-box;
            min-width: 0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 移动端适配：导航改为顶部横向滚动条 */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100dvh;
                overflow: hidden;
            }
            .sidebar {
                width: 100%;
                flex: 0 0 auto;
                display: flex;
                align-items: center;
                flex-wrap: nowrap;
                overflow-x: auto;
                gap: 6px;
                padding: 8px;
            }
            .sidebar h2 {
                flex: 0 0 auto;
                margin: 0 4px 0 0;
                font-size: 14px;
                white-space: nowrap;
            }
            .sidebar a {
                flex: 0 0 auto;
                padding: 6px 10px;
                background-color: #fff;
                border: 1px solid #ddd;
                border-radius: 4px;
                font-size: 13px;
                white-space: nowrap;
            }
            .content {
                flex: 1 1 auto;
                padding: 0;
                min-height: 0;
            }
            iframe {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>导航列表</h2>
        <!-- 游戏列表 -->
        <a href="proF/主页.html" target="gameFrame">主页</a>
        <a href="proF/CS平面版.html" target="gameFrame">CS平面版</a>
        <a href="proF/叶初弹弹乐.html" target="gameFrame">叶初弹弹乐</a>
        <a href="proF/双人足球.html" target="gameFrame">双人足球</a>
        <a href="proF/任意球练习.html" target="gameFrame">任意球练习</a>
        <a href="proF/练习模拟器.html" target="gameFrame">练习模拟器</a>
        <a href="proF/叶初打飞机.html" target="gameFrame">叶初打飞机</a>
        <a href="proF/叶初全明星.html" target="gameFrame">叶初全明星</a>
        <!-- 更多游戏链接 -->
    </div>
    
    <div class="content">
        <!-- 游戏显示区域 -->
        <iframe name="gameFrame" src="proF/主页.html"></iframe>
    </div>

</body>
</html>
